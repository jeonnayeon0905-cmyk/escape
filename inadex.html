<!DOCTYPE html>
<html lang="ko" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>방탈출 나만의 로그북</title>

    <!-- PWA iOS Support -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="방탈출로그">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- FontAwesome & Chart.js -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Noto Sans KR', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#f5f3ff',
                            100: '#ede9fe',
                            500: '#8b5cf6',
                            600: '#7c3aed',
                            700: '#6d28d9',
                            900: '#4c1d95',
                            950: '#0f0d1d'
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #0b0914;
            color: #f1f5f9;
            -webkit-tap-highlight-color: transparent;
        }
        /* Glassmorphism elements */
        .glass-card {
            background: rgba(22, 19, 43, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .glass-modal {
            background: rgba(15, 13, 29, 0.92);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(139, 92, 246, 0.2);
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #0b0914;
        }
        ::-webkit-scrollbar-thumb {
            background: #332a54;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #5b478d;
        }
    </style>
</head>
<body class="min-h-screen pb-20 select-none">

    <header class="sticky top-0 z-30 glass-card border-b border-violet-900/30 px-4 py-3 sm:px-6">
        <div class="max-w-5xl mx-auto flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-violet-600 to-fuchsia-600 flex items-center justify-center text-white shadow-lg shadow-violet-900/40">
                    <i class="fa-solid fa-key text-lg"></i>
                </div>
                <div>
                    <h1 class="text-lg font-extrabold tracking-tight bg-gradient-to-r from-white via-violet-200 to-violet-400 bg-clip-text text-transparent">방탈출 로그북</h1>
                    <p class="text-[11px] text-violet-300/70 font-medium">나만의 리얼 비밀 탈출 기록</p>
                </div>
            </div>

            <div class="flex items-center gap-2">
                <button onclick="exportData()" title="데이터 내보내기" class="px-3 py-1.5 rounded-lg bg-slate-800/80 hover:bg-slate-700 border border-slate-700 text-xs font-semibold text-slate-200 transition flex items-center gap-1.5">
                    <i class="fa-solid fa-download text-violet-400"></i>
                    <span class="hidden sm:inline">백업</span>
                </button>
                <button onclick="triggerImport()" title="데이터 불러오기" class="px-3 py-1.5 rounded-lg bg-slate-800/80 hover:bg-slate-700 border border-slate-700 text-xs font-semibold text-slate-200 transition flex items-center gap-1.5">
                    <i class="fa-solid fa-upload text-violet-400"></i>
                    <span class="hidden sm:inline">복원</span>
                </button>
                <input type="file" id="importFileInput" accept=".json" class="hidden" onchange="importData(event)">

                <button id="openAddModalBtn" class="px-3.5 py-1.5 rounded-lg bg-gradient-to-r from-violet-600 to-fuchsia-600 hover:from-violet-500 hover:to-fuchsia-500 text-white text-xs font-bold shadow-lg shadow-violet-900/50 transition flex items-center gap-1.5 active:scale-95">
                    <i class="fa-solid fa-plus"></i>
                    <span>기록 추가</span>
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-4 pt-6 space-y-6">

        <!-- Main Top Room Count Hero Banner -->
        <div class="glass-card p-5 sm:p-6 rounded-2xl relative overflow-hidden bg-gradient-to-r from-violet-900/40 via-fuchsia-900/30 to-slate-900/60 border border-violet-500/30 text-center flex flex-col items-center justify-center shadow-xl shadow-violet-950/50">
            <div class="absolute -right-6 -bottom-6 text-violet-500/10 text-9xl font-black pointer-events-none select-none">
                <i class="fa-solid fa-key"></i>
            </div>
            <span class="text-xs sm:text-sm font-bold text-violet-300 tracking-wider uppercase mb-1 flex items-center gap-1.5">
                <i class="fa-solid fa-door-open text-violet-400"></i> 방탈출 개수
            </span>
            <div class="flex items-baseline justify-center gap-1 my-1">
                <span id="heroTotalCount" class="text-4xl sm:text-5xl font-black tracking-tight bg-gradient-to-r from-white via-violet-100 to-fuchsia-200 bg-clip-text text-transparent">0방</span>
            </div>
            <div id="heroSuccessFailCount" class="text-xs sm:text-sm font-medium text-slate-300 mt-1.5 flex items-center gap-2.5 bg-slate-950/50 px-3 py-1 rounded-full border border-slate-800">
                <span class="text-emerald-400 font-bold flex items-center gap-1"><i class="fa-solid fa-circle-check text-[11px]"></i> 성공 0방</span>
                <span class="text-slate-700">|</span>
                <span class="text-rose-400 font-bold flex items-center gap-1"><i class="fa-solid fa-circle-xmark text-[11px]"></i> 실패 0방</span>
            </div>
        </div>

        <!-- Quick Summary Stats Grid -->
        <section class="grid grid-cols-2 sm:grid-cols-4 gap-3">
            <div class="glass-card p-4 rounded-2xl flex flex-col justify-between relative overflow-hidden group">
                <div class="absolute -right-2 -bottom-2 text-violet-500/10 text-6xl font-black group-hover:scale-110 transition"><i class="fa-solid fa-door-open"></i></div>
                <span class="text-xs font-semibold text-violet-300/80">총 도전 횟수</span>
                <div class="mt-2 flex items-baseline gap-1">
                    <span id="statTotal" class="text-2xl font-black text-white">0</span>
                    <span class="text-xs text-slate-400">회</span>
                </div>
            </div>

            <div class="glass-card p-4 rounded-2xl flex flex-col justify-between relative overflow-hidden group">
                <div class="absolute -right-2 -bottom-2 text-emerald-500/10 text-6xl font-black group-hover:scale-110 transition"><i class="fa-solid fa-trophy"></i></div>
                <span class="text-xs font-semibold text-violet-300/80">탈출 성공률</span>
                <div class="mt-2 flex items-baseline gap-1">
                    <span id="statSuccessRate" class="text-2xl font-black text-emerald-400">0%</span>
                    <span id="statSuccessCount" class="text-[11px] text-slate-400">(0승 0패)</span>
                </div>
            </div>

            <div class="glass-card p-4 rounded-2xl flex flex-col justify-between relative overflow-hidden group">
                <div class="absolute -right-2 -bottom-2 text-amber-500/10 text-6xl font-black group-hover:scale-110 transition"><i class="fa-solid fa-lightbulb"></i></div>
                <span class="text-xs font-semibold text-violet-300/80">평균 힌트</span>
                <div class="mt-2 flex items-baseline gap-1">
                    <span id="statAvgHints" class="text-2xl font-black text-amber-300">-</span>
                    <span class="text-xs text-slate-400">개</span>
                </div>
            </div>

            <div class="glass-card p-4 rounded-2xl flex flex-col justify-between relative overflow-hidden group">
                <div class="absolute -right-2 -bottom-2 text-fuchsia-500/10 text-6xl font-black group-hover:scale-110 transition"><i class="fa-solid fa-star"></i></div>
                <span class="text-xs font-semibold text-violet-300/80">평균 만족도</span>
                <div class="mt-2 flex items-baseline gap-1">
                    <span id="statAvgRating" class="text-2xl font-black text-fuchsia-300">0.0</span>
                    <span class="text-xs text-slate-400">/ 5.0</span>
                </div>
            </div>
        </section>

        <!-- View Toggle & Search Filters -->
        <section class="glass-card p-4 rounded-2xl space-y-4">
            <!-- Tabs -->
            <div class="flex items-center justify-between border-b border-slate-800 pb-3">
                <div class="flex items-center gap-2 bg-slate-900/90 p-1 rounded-xl border border-slate-800">
                    <button id="tabListBtn" onclick="switchTab('list')" class="px-4 py-1.5 rounded-lg text-xs font-bold transition bg-violet-600 text-white shadow">
                        <i class="fa-solid fa-list-ul mr-1.5"></i>기록 목록
                    </button>
                    <button id="tabStatsBtn" onclick="switchTab('stats')" class="px-4 py-1.5 rounded-lg text-xs font-bold transition text-slate-400 hover:text-white">
                        <i class="fa-solid fa-chart-pie mr-1.5"></i>통계 & 카페 분석
                    </button>
                </div>

                <div id="logCountBadge" class="text-xs font-medium text-slate-400">
                    총 <span id="filteredCount" class="text-violet-400 font-bold">0</span>개 기록
                </div>
            </div>

            <!-- List View Controls -->
            <div id="filterControls" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-2.5">
                <div class="relative">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-500 text-xs"></i>
                    <input type="text" id="searchInput" placeholder="테마명, 카페, 후기, 동행인 검색..." class="w-full bg-slate-950 border border-slate-800 rounded-xl pl-9 pr-3 py-2 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-violet-500 transition">
                </div>

                <select id="storeFilter" class="bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-violet-500 transition">
                    <option value="ALL">전체 방탈출 카페</option>
                </select>

                <select id="genreFilter" class="bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-violet-500 transition">
                    <option value="ALL">전체 장르</option>
                    <option value="공포">공포</option>
                    <option value="스릴러">스릴러</option>
                    <option value="감성/드라마">감성/드라마</option>
                    <option value="추리/미스터리">추리/미스터리</option>
                    <option value="코믹">코믹</option>
                    <option value="SF/판타지">SF/판타지</option>
                    <option value="모험/액션">모험/액션</option>
                    <option value="야외">야외</option>
                    <option value="???">???</option>
                    <option value="기타">기타</option>
                </select>

                <select id="sortFilter" class="bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-violet-500 transition">
                    <option value="DATE_DESC">최신 플레이 순</option>
                    <option value="DATE_ASC">오래된 순</option>
                    <option value="RATING_DESC">평점 높은 순</option>
                    <option value="SUCCESS_ONLY">성공한 테마만</option>
                    <option value="FAIL_ONLY">실패한 테마만</option>
                </select>
            </div>
        </section>

        <!-- View 1: Logs Grid View -->
        <section id="viewList" class="space-y-4">
            <div id="logsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3.5">
                <!-- Log Cards inject dynamically -->
            </div>

            <div id="emptyState" class="hidden glass-card p-12 rounded-2xl text-center space-y-3">
                <div class="w-16 h-16 rounded-full bg-slate-900 border border-slate-800 text-slate-600 flex items-center justify-center mx-auto text-2xl">
                    <i class="fa-solid fa-ghost"></i>
                </div>
                <h3 class="text-base font-bold text-slate-300">기록된 방탈출이 없습니다</h3>
                <p class="text-xs text-slate-500 max-w-sm mx-auto">상단의 '기록 추가' 버튼을 눌러 탈출 성공 기념 보드판과 함께 기록을 남겨보세요!</p>
            </div>
        </section>

        <!-- View 2: Analytics & Stats View -->
        <section id="viewStats" class="hidden space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <!-- Top Stores Chart / List -->
                <div class="glass-card p-5 rounded-2xl space-y-4">
                    <div class="flex items-center justify-between border-b border-slate-800 pb-3">
                        <h3 class="text-sm font-bold text-violet-300 flex items-center gap-2">
                            <i class="fa-solid fa-store text-violet-400"></i> 가장 많이 방문한 방탈출 카페 TOP 5
                        </h3>
                    </div>
                    <div id="topStoresList" class="space-y-2.5">
                        <!-- Top stores item list injected here -->
                    </div>
                </div>

                <!-- Genre Breakdown Chart -->
                <div class="glass-card p-5 rounded-2xl space-y-4 flex flex-col justify-between">
                    <h3 class="text-sm font-bold text-violet-300 flex items-center gap-2 border-b border-slate-800 pb-3">
                        <i class="fa-solid fa-masks-theater text-fuchsia-400"></i> 장르 분포 분석
                    </h3>
                    <div class="relative h-52 flex items-center justify-center">
                        <canvas id="genreChart"></canvas>
                    </div>
                </div>
            </div>

            <!-- Detailed Store Analysis Table -->
            <div class="glass-card p-5 rounded-2xl space-y-4">
                <h3 class="text-sm font-bold text-violet-300 flex items-center gap-2 border-b border-slate-800 pb-3">
                    <i class="fa-solid fa-building-columns text-emerald-400"></i> 매장별 상세 성적표 및 플레이 테마
                </h3>
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse text-xs">
                        <thead>
                            <tr class="border-b border-slate-800 text-slate-400">
                                <th class="py-2.5 px-3">매장명</th>
                                <th class="py-2.5 px-3 text-center">방문 횟수</th>
                                <th class="py-2.5 px-3 text-center">성공 횟수</th>
                                <th class="py-2.5 px-3 text-center">성공률</th>
                                <th class="py-2.5 px-3 text-center">평균 평점</th>
                                <th class="py-2.5 px-3 text-center">플레이 테마</th>
                            </tr>
                        </thead>
                        <tbody id="storeTableBody" class="divide-y divide-slate-800/60 text-slate-200">
                            <!-- Table rows injected here -->
                        </tbody>
                    </table>
                </div>
            </div>
        </section>

    </main>

    <!-- Log Modal (Create & Edit) -->
    <div id="logModal" class="fixed inset-0 z-50 flex items-center justify-center p-3 sm:p-4 bg-black/80 backdrop-blur-md hidden overflow-y-auto">
        <div class="glass-modal w-full max-w-xl rounded-2xl p-5 sm:p-6 my-auto shadow-2xl relative max-h-[90vh] overflow-y-auto">
            <button onclick="closeModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white transition w-8 h-8 rounded-full bg-slate-900 border border-slate-800 flex items-center justify-center">
                <i class="fa-solid fa-xmark text-sm"></i>
            </button>

            <h2 id="modalTitle" class="text-base font-bold text-white mb-5 flex items-center gap-2">
                <i class="fa-solid fa-key text-violet-400"></i> 새 방탈출 기록하기
            </h2>

            <form id="logForm" class="space-y-4 text-xs">
                <input type="hidden" id="editLogId">

                <!-- Basic Info -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                        <label class="block font-semibold text-slate-300 mb-1">방탈출 카페(매장명) <span class="text-rose-400">*</span></label>
                        <input type="text" id="storeName" required placeholder="예: 키링키링 강남점" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-violet-500 transition">
                    </div>
                    <div>
                        <label class="block font-semibold text-slate-300 mb-1">테마명 <span class="text-rose-400">*</span></label>
                        <input type="text" id="themeName" required placeholder="예: 비밀의 화원" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-violet-500 transition">
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                        <label class="block font-semibold text-slate-300 mb-1">플레이 날짜</label>
                        <input type="date" id="playDate" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-violet-500 transition">
                    </div>
                    <div>
                        <label class="block font-semibold text-slate-300 mb-1">탈출 성공 여부</label>
                        <div class="grid grid-cols-2 gap-2 mt-0.5">
                            <label class="flex items-center justify-center gap-1.5 p-2 rounded-xl border border-slate-800 bg-slate-950 text-slate-300 cursor-pointer has-[:checked]:bg-emerald-950/60 has-[:checked]:border-emerald-500/50 has-[:checked]:text-emerald-400 transition">
                                <input type="radio" name="isSuccess" value="true" checked class="hidden">
                                <i class="fa-solid fa-circle-check"></i> 성공
                            </label>
                            <label class="flex items-center justify-center gap-1.5 p-2 rounded-xl border border-slate-800 bg-slate-950 text-slate-300 cursor-pointer has-[:checked]:bg-rose-950/60 has-[:checked]:border-rose-500/50 has-[:checked]:text-rose-400 transition">
                                <input type="radio" name="isSuccess" value="false" class="hidden">
                                <i class="fa-solid fa-circle-xmark"></i> 실패
                            </label>
                        </div>
                    </div>
                </div>

                <!-- Multi-select Genres -->
                <div>
                    <label class="block font-semibold text-slate-300 mb-1.5">장르 / 테마 (복수 선택 가능)</label>
                    <div id="genreChipsContainer" class="flex flex-wrap gap-1.5">
                        <!-- Genre chips dynamically rendered -->
                    </div>
                    <div id="customGenreWrapper" class="mt-2 hidden">
                        <input type="text" id="customGenreInput" placeholder="기타 장르명 직접 입력" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-1.5 text-white focus:outline-none focus:border-violet-500 transition">
                    </div>
                </div>

                <!-- Time Left & Hints Used -->
                <div class="bg-slate-900/50 p-3 rounded-xl border border-slate-800/80 space-y-2.5">
                    <div class="grid grid-cols-2 sm:grid-cols-3 gap-3">
                        <div>
                            <label class="block text-[11px] font-semibold text-slate-300 mb-1">남은 시간 (분)</label>
                            <input type="number" id="timeLeftMin" min="0" max="180" placeholder="예: 12" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-violet-500 transition disabled:opacity-40 disabled:cursor-not-allowed">
                        </div>
                        <div>
                            <label class="block text-[11px] font-semibold text-slate-300 mb-1">남은 시간 (초)</label>
                            <input type="number" id="timeLeftSec" min="0" max="59" placeholder="예: 45" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-violet-500 transition disabled:opacity-40 disabled:cursor-not-allowed">
                        </div>
                        <div class="col-span-2 sm:col-span-1">
                            <label class="block text-[11px] font-semibold text-slate-300 mb-1">사용 힌트 수</label>
                            <input type="text" id="hintsUsed" placeholder="예: 2, 기억안남, 다수" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-violet-500 transition">
                        </div>
                    </div>
                    <div class="flex items-center gap-2 pt-0.5">
                        <input type="checkbox" id="timeUnknown" class="w-3.5 h-3.5 rounded accent-violet-600 bg-slate-950 border-slate-800 cursor-pointer">
                        <label for="timeUnknown" class="text-[11px] text-slate-300 cursor-pointer select-none">남은 시간 모름 / 기억 안 남</label>
                    </div>
                </div>

                <!-- Rating & Options -->
                <div class="grid grid-cols-3 gap-3">
                    <div>
                        <label class="block font-semibold text-slate-300 mb-1">만족도 (평점)</label>
                        <select id="rating" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-2.5 py-2 text-amber-300 font-bold focus:outline-none focus:border-violet-500 transition">
                            <option value="5">★★★★★ (5.0)</option>
                            <option value="4.5">★★★★☆ (4.5)</option>
                            <option value="4">★★★★☆ (4.0)</option>
                            <option value="3.5">★★★☆☆ (3.5)</option>
                            <option value="3">★★★☆☆ (3.0)</option>
                            <option value="2">★★☆☆☆ (2.0)</option>
                            <option value="1">★☆☆☆☆ (1.0)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block font-semibold text-slate-300 mb-1">체감 난이도</label>
                        <select id="difficulty" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-2.5 py-2 text-slate-200 focus:outline-none focus:border-violet-500 transition">
                            <option value="매우 쉬움">매우 쉬움</option>
                            <option value="쉬움">쉬움</option>
                            <option value="보통" selected>보통</option>
                            <option value="어려움">어려움</option>
                            <option value="극난이도">극난이도</option>
                        </select>
                    </div>
                    <div>
                        <label class="block font-semibold text-slate-300 mb-1">활동성</label>
                        <select id="activity" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-2.5 py-2 text-slate-200 focus:outline-none focus:border-violet-500 transition">
                            <option value="없음">없음</option>
                            <option value="적음">적음</option>
                            <option value="보통" selected>보통</option>
                            <option value="높음">높음</option>
                            <option value="매우 높음">매우 높음</option>
                        </select>
                    </div>
                </div>

                <!-- Party Members (동행인) -->
                <div>
                    <label class="block font-semibold text-slate-300 mb-1"><i class="fa-solid fa-users text-violet-400 mr-1"></i> 함께 간 사람 (동행인)</label>
                    <input type="text" id="partyMembers" placeholder="예: 민수, 지은, 철수 (총 3명)" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-violet-500 transition">
                </div>

                <!-- Review Memo -->
                <div>
                    <label class="block font-semibold text-slate-300 mb-1">한줄평 및 메모</label>
                    <textarea id="reviewMemo" rows="2" placeholder="연출이 최고였음! 3번 방 자물쇠 문제 주의..." class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-violet-500 transition resize-none"></textarea>
                </div>

                <!-- Photo Upload -->
                <div>
                    <label class="block font-semibold text-slate-300 mb-1">성공 인증샷 / 보드판 사진</label>
                    <div class="flex items-center gap-3">
                        <label class="flex items-center justify-center gap-2 px-3.5 py-2 rounded-xl bg-slate-900 hover:bg-slate-800 border border-slate-800 cursor-pointer text-slate-300 transition">
                            <i class="fa-solid fa-camera text-violet-400"></i> 사진 선택
                            <input type="file" id="photoInput" accept="image/*" class="hidden" onchange="handlePhotoUpload(event)">
                        </label>
                        <span id="photoFileName" class="text-slate-500 text-[11px] truncate max-w-[200px]">사진 없음</span>
                        <button type="button" id="removePhotoBtn" onclick="removePhoto()" class="hidden text-rose-400 text-xs hover:underline">삭제</button>
                    </div>
                    <div id="photoPreviewBox" class="mt-2 hidden">
                        <img id="photoPreviewImg" class="h-20 rounded-lg border border-slate-800 object-cover">
                    </div>
                    <input type="hidden" id="photoBase64">
                </div>

                <!-- Action Buttons -->
                <div class="flex items-center justify-end gap-2 pt-2 border-t border-slate-800">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold transition">취소</button>
                    <button type="submit" class="px-5 py-2 rounded-xl bg-gradient-to-r from-violet-600 to-fuchsia-600 hover:from-violet-500 hover:to-fuchsia-500 text-white font-bold shadow-lg shadow-violet-900/40 transition">저장하기</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Detailed View Modal -->
    <div id="detailModal" class="fixed inset-0 z-50 flex items-center justify-center p-3 sm:p-4 bg-black/85 backdrop-blur-md hidden overflow-y-auto">
        <div class="glass-modal w-full max-w-lg rounded-2xl p-5 sm:p-6 my-auto shadow-2xl relative max-h-[92vh] overflow-y-auto">
            <button onclick="closeDetailModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white transition w-8 h-8 rounded-full bg-slate-900 border border-slate-800 flex items-center justify-center z-10">
                <i class="fa-solid fa-xmark text-sm"></i>
            </button>

            <div id="detailContent" class="space-y-4">
                <!-- Injected dynamically -->
            </div>
        </div>
    </div>

    <!-- Image Full Lightbox -->
    <div id="lightboxModal" class="fixed inset-0 z-50 bg-black/95 flex items-center justify-center p-4 hidden" onclick="closeLightbox()">
        <img id="lightboxImg" class="max-w-full max-h-full rounded-xl object-contain shadow-2xl">
    </div>

    <script>
        const STORAGE_KEY = 'escape_room_logs_v2';
        let logs = [];
        let selectedFormGenres = new Set();
        let genreChartInstance = null;

        const GENRE_OPTIONS = ['공포', '스릴러', '감성/드라마', '추리/미스터리', '코믹', 'SF/판타지', '모험/액션', '야외', '???', '기타'];

        // Load Initial Data
        window.onload = function() {
            loadLogs();
            initGenreChips();
            setupEventListeners();
            updateStats();
            renderLogs();
        };

        function loadLogs() {
            const data = localStorage.getItem(STORAGE_KEY);
            if (data) {
                try {
                    logs = JSON.parse(data);
                } catch (e) {
                    logs = [];
                }
            } else {
                // Sample record if first time
                logs = [{
                    id: 'sample-1',
                    storeName: '키링키링 강남점',
                    themeName: '미드나잇 미스터리',
                    playDate: new Date().toISOString().split('T')[0],
                    genres: ['추리/미스터리', '스릴러'],
                    isSuccess: true,
                    timeUnknown: false,
                    timeLeftMin: 12,
                    timeLeftSec: 30,
                    hintsUsed: '1',
                    rating: 5,
                    difficulty: '보통',
                    activity: '적음',
                    partyMembers: '김탈출, 이방탈',
                    reviewMemo: '연출과 인테리어가 환상적이었습니다! 꼭 다시 가고 싶은 테마.',
                    photoBase64: null,
                    createdAt: Date.now()
                }];
                saveLogs();
            }
        }

        function saveLogs() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(logs));
        }

        function parseGenres(log) {
            if (Array.isArray(log.genres)) return log.genres;
            if (typeof log.genre === 'string') return [log.genre];
            return ['기타'];
        }

        function initGenreChips() {
            const container = document.getElementById('genreChipsContainer');
            container.innerHTML = GENRE_OPTIONS.map(g => `
                <button type="button" onclick="toggleGenreChip('${g}')" id="chip-${g}" class="px-2.5 py-1 rounded-lg border text-xs font-medium transition cursor-pointer bg-slate-950 border-slate-800 text-slate-400 hover:text-slate-200">
                    ${g}
                </button>
            `).join('');
        }

        function toggleGenreChip(genre) {
            if (selectedFormGenres.has(genre)) {
                selectedFormGenres.delete(genre);
            } else {
                selectedFormGenres.add(genre);
            }
            updateGenreChipUI();
        }

        function updateGenreChipUI() {
            GENRE_OPTIONS.forEach(g => {
                const btn = document.getElementById(`chip-${g}`);
                if (!btn) return;
                if (selectedFormGenres.has(g)) {
                    btn.className = "px-2.5 py-1 rounded-lg border text-xs font-bold transition cursor-pointer bg-violet-600/30 border-violet-500 text-violet-300 shadow-sm";
                } else {
                    btn.className = "px-2.5 py-1 rounded-lg border text-xs font-medium transition cursor-pointer bg-slate-950 border-slate-800 text-slate-400 hover:text-slate-200";
                }
            });

            const customWrapper = document.getElementById('customGenreWrapper');
            if (selectedFormGenres.has('기타')) {
                customWrapper.classList.remove('hidden');
            } else {
                customWrapper.classList.add('hidden');
            }
        }

        function setupEventListeners() {
            document.getElementById('searchInput').addEventListener('input', renderLogs);
            document.getElementById('storeFilter').addEventListener('change', renderLogs);
            document.getElementById('genreFilter').addEventListener('change', renderLogs);
            document.getElementById('sortFilter').addEventListener('change', renderLogs);

            document.getElementById('openAddModalBtn').addEventListener('click', () => openModal(false));

            const timeUnknown = document.getElementById('timeUnknown');
            timeUnknown.addEventListener('change', (e) => {
                const disabled = e.target.checked;
                document.getElementById('timeLeftMin').disabled = disabled;
                document.getElementById('timeLeftSec').disabled = disabled;
                if (disabled) {
                    document.getElementById('timeLeftMin').value = '';
                    document.getElementById('timeLeftSec').value = '';
                }
            });
        }

        function switchTab(tab) {
            const listBtn = document.getElementById('tabListBtn');
            const statsBtn = document.getElementById('tabStatsBtn');
            const viewList = document.getElementById('viewList');
            const viewStats = document.getElementById('viewStats');
            const filterControls = document.getElementById('filterControls');

            if (tab === 'list') {
                listBtn.className = "px-4 py-1.5 rounded-lg text-xs font-bold transition bg-violet-600 text-white shadow";
                statsBtn.className = "px-4 py-1.5 rounded-lg text-xs font-bold transition text-slate-400 hover:text-white";
                viewList.classList.remove('hidden');
                viewStats.classList.add('hidden');
                filterControls.classList.remove('hidden');
            } else {
                statsBtn.className = "px-4 py-1.5 rounded-lg text-xs font-bold transition bg-violet-600 text-white shadow";
                listBtn.className = "px-4 py-1.5 rounded-lg text-xs font-bold transition text-slate-400 hover:text-white";
                viewList.classList.add('hidden');
                viewStats.classList.remove('hidden');
                filterControls.classList.add('hidden');
                renderCharts();
            }
        }

        function updateStats() {
            const total = logs.length;
            const wins = logs.filter(l => l.isSuccess).length;
            const losses = total - wins;
            const winRate = total > 0 ? Math.round((wins / total) * 100) : 0;

            // Update Top Hero Room Banner
            const heroTotalCount = document.getElementById('heroTotalCount');
            if (heroTotalCount) heroTotalCount.innerText = `${total}방`;

            const heroSuccessFail = document.getElementById('heroSuccessFailCount');
            if (heroSuccessFail) {
                heroSuccessFail.innerHTML = `
                    <span class="text-emerald-400 font-bold flex items-center gap-1"><i class="fa-solid fa-circle-check text-[11px]"></i> 성공 ${wins}방</span>
                    <span class="text-slate-700">|</span>
                    <span class="text-rose-400 font-bold flex items-center gap-1"><i class="fa-solid fa-circle-xmark text-[11px]"></i> 실패 ${losses}방</span>
                `;
            }

            // Numeric hints filter
            const numericHints = logs
                .map(l => l.hintsUsed)
                .filter(h => h !== undefined && h !== null && h !== '' && !isNaN(Number(h)))
                .map(Number);

            const avgHints = numericHints.length > 0 
                ? (numericHints.reduce((a, b) => a + b, 0) / numericHints.length).toFixed(1) 
                : '-';

            const totalRating = logs.reduce((acc, cur) => acc + (Number(cur.rating) || 0), 0);
            const avgRating = total > 0 ? (totalRating / total).toFixed(1) : '0.0';

            document.getElementById('statTotal').innerText = total;
            document.getElementById('statSuccessRate').innerText = `${winRate}%`;
            document.getElementById('statSuccessCount').innerText = `(${wins}승 ${losses}패)`;
            document.getElementById('statAvgHints').innerText = avgHints;
            document.getElementById('statAvgRating').innerText = avgRating;

            populateStoreDropdowns();
        }

        function populateStoreDropdowns() {
            const select = document.getElementById('storeFilter');
            const current = select.value;
            const stores = Array.from(new Set(logs.map(l => l.storeName).filter(Boolean))).sort();

            select.innerHTML = `<option value="ALL">전체 방탈출 카페 (${stores.length})</option>` +
                stores.map(s => `<option value="${escapeHtml(s)}">${escapeHtml(s)}</option>`).join('');

            select.value = current;
        }

        function renderLogs() {
            const search = document.getElementById('searchInput').value.trim().toLowerCase();
            const storeVal = document.getElementById('storeFilter').value;
            const genreVal = document.getElementById('genreFilter').value;
            const sortVal = document.getElementById('sortFilter').value;

            let filtered = logs.filter(log => {
                const genres = parseGenres(log);
                const matchesSearch = !search || 
                    (log.themeName && log.themeName.toLowerCase().includes(search)) ||
                    (log.storeName && log.storeName.toLowerCase().includes(search)) ||
                    (log.reviewMemo && log.reviewMemo.toLowerCase().includes(search)) ||
                    (log.partyMembers && log.partyMembers.toLowerCase().includes(search));

                const matchesStore = storeVal === 'ALL' || log.storeName === storeVal;
                const matchesGenre = genreVal === 'ALL' || genres.includes(genreVal);

                let matchesSortRule = true;
                if (sortVal === 'SUCCESS_ONLY') matchesSortRule = log.isSuccess;
                if (sortVal === 'FAIL_ONLY') matchesSortRule = !log.isSuccess;

                return matchesSearch && matchesStore && matchesGenre && matchesSortRule;
            });

            // Sorting
            filtered.sort((a, b) => {
                if (sortVal === 'DATE_ASC') return new Date(a.playDate) - new Date(b.playDate);
                if (sortVal === 'RATING_DESC') return (b.rating || 0) - (a.rating || 0);
                return new Date(b.playDate) - new Date(a.playDate); // DATE_DESC default
            });

            document.getElementById('filteredCount').innerText = filtered.length;
            const grid = document.getElementById('logsGrid');
            const emptyState = document.getElementById('emptyState');

            if (filtered.length === 0) {
                grid.innerHTML = '';
                emptyState.classList.remove('hidden');
                return;
            }
            emptyState.classList.add('hidden');

            grid.innerHTML = filtered.map(log => {
                const genres = parseGenres(log);
                const genreBadges = genres.map(g => `<span class="bg-slate-900 border border-slate-800 text-slate-300 px-1.5 py-0.5 rounded text-[10px]">${escapeHtml(g)}</span>`).join(' ');

                let timeDisplay = '기록 없음';
                if (log.timeUnknown) {
                    timeDisplay = '시간 모름';
                } else if (log.timeLeftMin || log.timeLeftSec) {
                    timeDisplay = `${log.timeLeftMin || 0}분 ${log.timeLeftSec || 0}초 남음`;
                }

                const statusBadge = log.isSuccess 
                    ? `<span class="px-2 py-0.5 rounded text-[10px] font-bold bg-emerald-500/20 text-emerald-400 border border-emerald-500/30"><i class="fa-solid fa-circle-check"></i> 성공</span>`
                    : `<span class="px-2 py-0.5 rounded text-[10px] font-bold bg-rose-500/20 text-rose-400 border border-rose-500/30"><i class="fa-solid fa-circle-xmark"></i> 실패</span>`;

                const thumb = log.photoBase64 
                    ? `<img src="${log.photoBase64}" class="w-16 h-16 rounded-xl object-cover border border-slate-800 shrink-0">`
                    : `<div class="w-16 h-16 rounded-xl bg-slate-900 border border-slate-800 flex items-center justify-center text-slate-700 text-xl shrink-0"><i class="fa-solid fa-image"></i></div>`;

                return `
                    <div onclick="openDetailModal('${log.id}')" class="glass-card p-3.5 rounded-2xl flex gap-3 cursor-pointer hover:border-violet-500/50 hover:bg-slate-900/60 transition group">
                        ${thumb}
                        <div class="flex-1 min-w-0 flex flex-col justify-between">
                            <div>
                                <div class="flex items-center justify-between gap-1 mb-1">
                                    <span class="text-[11px] text-violet-400 font-semibold truncate"><i class="fa-solid fa-store text-[10px] mr-1"></i>${escapeHtml(log.storeName)}</span>
                                    ${statusBadge}
                                </div>
                                <h3 class="text-sm font-bold text-white truncate group-hover:text-violet-300 transition">${escapeHtml(log.themeName)}</h3>
                            </div>

                            <div class="space-y-1 mt-1.5">
                                <div class="flex items-center gap-1.5 flex-wrap">
                                    ${genreBadges}
                                </div>
                                <div class="flex items-center justify-between text-[11px] text-slate-400 pt-0.5">
                                    <span><i class="fa-regular fa-calendar mr-1"></i>${log.playDate}</span>
                                    <span class="text-amber-400 font-bold"><i class="fa-solid fa-star text-[10px]"></i> ${Number(log.rating).toFixed(1)}</span>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function openDetailModal(id) {
            const log = logs.find(l => l.id === id);
            if (!log) return;

            const genres = parseGenres(log);
            const genreBadges = genres.map(g => `<span class="bg-violet-950/60 border border-violet-800/60 text-violet-300 px-2 py-0.5 rounded-md text-xs font-medium">${escapeHtml(g)}</span>`).join(' ');

            let timeText = '기록 없음';
            if (log.timeUnknown) {
                timeText = '남은 시간 모름 / 기억 안 남';
            } else if (log.timeLeftMin || log.timeLeftSec) {
                timeText = `${log.timeLeftMin || 0}분 ${log.timeLeftSec || 0}초 남음`;
            }

            let hintsText = '기록 없음';
            if (log.hintsUsed !== undefined && log.hintsUsed !== null && String(log.hintsUsed).trim() !== '') {
                hintsText = isNaN(Number(log.hintsUsed)) ? String(log.hintsUsed) : `${log.hintsUsed}개 사용`;
            }

            const statusBadge = log.isSuccess 
                ? `<span class="px-3 py-1 rounded-lg text-xs font-extrabold bg-emerald-500/20 text-emerald-400 border border-emerald-500/40 inline-flex items-center gap-1.5"><i class="fa-solid fa-circle-check"></i> 탈출 성공</span>`
                : `<span class="px-3 py-1 rounded-lg text-xs font-extrabold bg-rose-500/20 text-rose-400 border border-rose-500/40 inline-flex items-center gap-1.5"><i class="fa-solid fa-circle-xmark"></i> 탈출 실패</span>`;

            const photoSection = log.photoBase64 
                ? `<div class="relative group cursor-pointer" onclick="openLightbox('${log.photoBase64}')">
                    <img src="${log.photoBase64}" class="w-full max-h-64 object-cover rounded-xl border border-slate-800 shadow-lg">
                    <div class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition rounded-xl flex items-center justify-center text-white text-xs font-bold gap-2">
                        <i class="fa-solid fa-magnifying-glass-plus"></i> 클릭하여 크게 보기
                    </div>
                   </div>`
                : '';

            document.getElementById('detailContent').innerHTML = `
                ${photoSection}
                <div class="space-y-3">
                    <div class="flex items-center justify-between gap-2">
                        <span class="text-xs font-semibold text-violet-400"><i class="fa-solid fa-store mr-1"></i>${escapeHtml(log.storeName)}</span>
                        ${statusBadge}
                    </div>

                    <h2 class="text-xl font-black text-white">${escapeHtml(log.themeName)}</h2>

                    <div class="flex flex-wrap gap-1.5">${genreBadges}</div>

                    <!-- Metrics Table -->
                    <div class="grid grid-cols-2 gap-2.5 bg-slate-900/80 p-3.5 rounded-xl border border-slate-800 text-xs">
                        <div>
                            <span class="text-slate-400 block text-[11px]">플레이 날짜</span>
                            <span class="font-bold text-slate-200">${log.playDate}</span>
                        </div>
                        <div>
                            <span class="text-slate-400 block text-[11px]">남은 시간</span>
                            <span class="font-bold text-violet-300">${timeText}</span>
                        </div>
                        <div>
                            <span class="text-slate-400 block text-[11px]">사용 힌트</span>
                            <span class="font-bold text-amber-300">${hintsText}</span>
                        </div>
                        <div>
                            <span class="text-slate-400 block text-[11px]">체감 난이도 / 활동성</span>
                            <span class="font-bold text-slate-200">${escapeHtml(log.difficulty || '보통')} / ${escapeHtml(log.activity || '보통')}</span>
                        </div>
                    </div>

                    <!-- Party Members -->
                    <div class="bg-violet-950/20 p-3 rounded-xl border border-violet-900/30">
                        <span class="text-[11px] font-bold text-violet-300 block mb-1"><i class="fa-solid fa-users mr-1"></i> 함께 간 사람 (동행인)</span>
                        <p class="text-xs text-slate-200 font-medium">${escapeHtml(log.partyMembers || '기록 없음')}</p>
                    </div>

                    <!-- Review Memo -->
                    ${log.reviewMemo ? `
                        <div class="bg-slate-900/60 p-3 rounded-xl border border-slate-800">
                            <span class="text-[11px] font-bold text-slate-400 block mb-1"><i class="fa-solid fa-comment-dots mr-1"></i> 후기 & 메모</span>
                            <p class="text-xs text-slate-300 whitespace-pre-line leading-relaxed">${escapeHtml(log.reviewMemo)}</p>
                        </div>
                    ` : ''}

                    <div class="flex items-center justify-between pt-2 border-t border-slate-800">
                        <span class="text-amber-400 font-bold text-sm"><i class="fa-solid fa-star"></i> 평점 ${Number(log.rating).toFixed(1)} / 5.0</span>
                        <div class="flex items-center gap-2">
                            <button onclick="editLog('${log.id}')" class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-xs font-semibold text-slate-200 transition">수정</button>
                            <button onclick="deleteLog('${log.id}')" class="px-3 py-1.5 rounded-lg bg-rose-950/60 border border-rose-800/60 hover:bg-rose-900 text-xs font-semibold text-rose-300 transition">삭제</button>
                        </div>
                    </div>
                </div>
            `;

            document.getElementById('detailModal').classList.remove('hidden');
        }

        function closeDetailModal() {
            document.getElementById('detailModal').classList.add('hidden');
        }

        function openLightbox(src) {
            document.getElementById('lightboxImg').src = src;
            document.getElementById('lightboxModal').classList.remove('hidden');
        }

        function closeLightbox() {
            document.getElementById('lightboxModal').classList.add('hidden');
        }

        function openModal(isEdit = false) {
            document.getElementById('modalTitle').innerHTML = isEdit 
                ? `<i class="fa-solid fa-pen-to-square text-violet-400"></i> 방탈출 기록 수정` 
                : `<i class="fa-solid fa-key text-violet-400"></i> 새 방탈출 기록하기`;
            document.getElementById('logModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('logModal').classList.add('hidden');
            document.getElementById('logForm').reset();
            document.getElementById('editLogId').value = '';
            document.getElementById('photoBase64').value = '';
            document.getElementById('photoFileName').innerText = '사진 없음';
            document.getElementById('photoPreviewBox').classList.add('hidden');
            document.getElementById('removePhotoBtn').classList.add('hidden');
            document.getElementById('timeLeftMin').disabled = false;
            document.getElementById('timeLeftSec').disabled = false;
            selectedFormGenres.clear();
            updateGenreChipUI();
        }

        function editLog(id) {
            closeDetailModal();
            const log = logs.find(l => l.id === id);
            if (!log) return;

            document.getElementById('editLogId').value = log.id;
            document.getElementById('storeName').value = log.storeName || '';
            document.getElementById('themeName').value = log.themeName || '';
            document.getElementById('playDate').value = log.playDate || '';

            const radios = document.getElementsByName('isSuccess');
            radios.forEach(r => r.checked = (r.value === 'true') === log.isSuccess);

            // Genres
            selectedFormGenres = new Set(parseGenres(log));
            updateGenreChipUI();

            const isTimeUnknown = !!log.timeUnknown;
            document.getElementById('timeUnknown').checked = isTimeUnknown;
            document.getElementById('timeLeftMin').disabled = isTimeUnknown;
            document.getElementById('timeLeftSec').disabled = isTimeUnknown;
            document.getElementById('timeLeftMin').value = isTimeUnknown ? '' : (log.timeLeftMin || '');
            document.getElementById('timeLeftSec').value = isTimeUnknown ? '' : (log.timeLeftSec || '');

            document.getElementById('hintsUsed').value = log.hintsUsed !== undefined ? log.hintsUsed : '';
            document.getElementById('rating').value = log.rating || '5';
            document.getElementById('difficulty').value = log.difficulty || '보통';
            document.getElementById('activity').value = log.activity || '보통';
            document.getElementById('partyMembers').value = log.partyMembers || '';
            document.getElementById('reviewMemo').value = log.reviewMemo || '';

            if (log.photoBase64) {
                document.getElementById('photoBase64').value = log.photoBase64;
                document.getElementById('photoPreviewImg').src = log.photoBase64;
                document.getElementById('photoPreviewBox').classList.remove('hidden');
                document.getElementById('removePhotoBtn').classList.remove('hidden');
                document.getElementById('photoFileName').innerText = '기존 사진 등록됨';
            }

            openModal(true);
        }

        function deleteLog(id) {
            if (!confirm('정말 이 방탈출 기록을 삭제하시겠습니까?')) return;
            logs = logs.filter(l => l.id !== id);
            saveLogs();
            updateStats();
            renderLogs();
            closeDetailModal();
        }

        document.getElementById('logForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const editId = document.getElementById('editLogId').value;
            const isSuccess = document.querySelector('input[name="isSuccess"]:checked').value === 'true';
            const timeUnknown = document.getElementById('timeUnknown').checked;

            let genres = Array.from(selectedFormGenres);
            if (genres.includes('기타')) {
                genres = genres.filter(g => g !== '기타');
                const customVal = document.getElementById('customGenreInput').value.trim();
                genres.push(customVal || '기타');
            }
            if (genres.length === 0) genres = ['기타'];

            const newLog = {
                id: editId || 'log-' + Date.now(),
                storeName: document.getElementById('storeName').value.trim(),
                themeName: document.getElementById('themeName').value.trim(),
                playDate: document.getElementById('playDate').value,
                genres: genres,
                isSuccess: isSuccess,
                timeUnknown: timeUnknown,
                timeLeftMin: timeUnknown ? 0 : (Number(document.getElementById('timeLeftMin').value) || 0),
                timeLeftSec: timeUnknown ? 0 : (Number(document.getElementById('timeLeftSec').value) || 0),
                hintsUsed: document.getElementById('hintsUsed').value.trim(),
                rating: Number(document.getElementById('rating').value) || 5,
                difficulty: document.getElementById('difficulty').value,
                activity: document.getElementById('activity').value,
                partyMembers: document.getElementById('partyMembers').value.trim(),
                reviewMemo: document.getElementById('reviewMemo').value.trim(),
                photoBase64: document.getElementById('photoBase64').value || null,
                updatedAt: Date.now()
            };

            if (editId) {
                const idx = logs.findIndex(l => l.id === editId);
                if (idx !== -1) logs[idx] = newLog;
            } else {
                logs.unshift(newLog);
            }

            saveLogs();
            updateStats();
            renderLogs();
            closeModal();
        });

        function handlePhotoUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            document.getElementById('photoFileName').innerText = file.name;

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    let width = img.width;
                    let height = img.height;
                    const maxDim = 800;

                    if (width > height) {
                        if (width > maxDim) {
                            height = Math.round((height * maxDim) / width);
                            width = maxDim;
                        }
                    } else {
                        if (height > maxDim) {
                            width = Math.round((width * maxDim) / height);
                            height = maxDim;
                        }
                    }

                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);

                    const compressedBase64 = canvas.toDataURL('image/jpeg', 0.75);
                    document.getElementById('photoBase64').value = compressedBase64;
                    document.getElementById('photoPreviewImg').src = compressedBase64;
                    document.getElementById('photoPreviewBox').classList.remove('hidden');
                    document.getElementById('removePhotoBtn').classList.remove('hidden');
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function removePhoto() {
            document.getElementById('photoInput').value = '';
            document.getElementById('photoBase64').value = '';
            document.getElementById('photoFileName').innerText = '사진 없음';
            document.getElementById('photoPreviewBox').classList.add('hidden');
            document.getElementById('removePhotoBtn').classList.add('hidden');
        }

        function renderCharts() {
            // Render Store TOP 5
            const storeCounts = {};
            logs.forEach(l => {
                if (l.storeName) {
                    storeCounts[l.storeName] = (storeCounts[l.storeName] || 0) + 1;
                }
            });

            const sortedStores = Object.entries(storeCounts)
                .sort((a, b) => b[1] - a[1])
                .slice(0, 5);

            const topStoresList = document.getElementById('topStoresList');
            if (sortedStores.length === 0) {
                topStoresList.innerHTML = `<p class="text-slate-500 text-xs py-4 text-center">등록된 매장 데이터가 없습니다.</p>`;
            } else {
                topStoresList.innerHTML = sortedStores.map(([store, count], idx) => {
                    const storeLogs = logs.filter(l => l.storeName === store);
                    const themeNames = storeLogs.map(l => escapeHtml(l.themeName)).join(', ');
                    return `
                        <div class="p-2.5 rounded-xl bg-slate-900/60 border border-slate-800 text-xs space-y-1.5">
                            <div class="flex items-center justify-between">
                                <div class="flex items-center gap-2.5 min-w-0">
                                    <span class="w-5 h-5 rounded-lg bg-violet-600/30 text-violet-300 font-extrabold flex items-center justify-center text-[10px] shrink-0">${idx + 1}</span>
                                    <span class="font-bold text-white truncate">${escapeHtml(store)}</span>
                                </div>
                                <span class="text-violet-400 font-extrabold shrink-0">${count}회 방문</span>
                            </div>
                            <div class="pl-7 text-[11px] text-slate-400 truncate">
                                <i class="fa-solid fa-key text-[10px] text-violet-400/80 mr-1"></i>${themeNames}
                            </div>
                        </div>
                    `;
                }).join('');
            }

            // Render Store Detailed Table
            const storeStats = {};
            logs.forEach(l => {
                if (!l.storeName) return;
                if (!storeStats[l.storeName]) {
                    storeStats[l.storeName] = { total: 0, wins: 0, ratingSum: 0, logs: [] };
                }
                storeStats[l.storeName].total += 1;
                if (l.isSuccess) storeStats[l.storeName].wins += 1;
                storeStats[l.storeName].ratingSum += Number(l.rating) || 0;
                storeStats[l.storeName].logs.push(l);
            });

            const tableBody = document.getElementById('storeTableBody');
            const storeRows = Object.entries(storeStats).sort((a, b) => b[1].total - a[1].total);

            if (storeRows.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="6" class="py-4 text-center text-slate-500">데이터가 존재하지 않습니다.</td></tr>`;
            } else {
                tableBody.innerHTML = storeRows.map(([store, stat], idx) => {
                    const rate = Math.round((stat.wins / stat.total) * 100);
                    const avgR = (stat.ratingSum / stat.total).toFixed(1);
                    const storeId = `store-detail-${idx}`;

                    const themeCardsHtml = stat.logs.map(log => {
                        const statusBadge = log.isSuccess
                            ? `<span class="px-1.5 py-0.5 rounded text-[10px] font-bold bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 shrink-0"><i class="fa-solid fa-circle-check"></i> 성공</span>`
                            : `<span class="px-1.5 py-0.5 rounded text-[10px] font-bold bg-rose-500/20 text-rose-400 border border-rose-500/30 shrink-0"><i class="fa-solid fa-circle-xmark"></i> 실패</span>`;
                        
                        return `
                            <div onclick="openDetailModal('${log.id}')" class="flex items-center justify-between p-2 rounded-xl bg-slate-950/80 hover:bg-violet-950/50 border border-slate-800 hover:border-violet-500/50 transition cursor-pointer group">
                                <div class="flex items-center gap-2 min-w-0 pr-2">
                                    <span class="text-xs font-bold text-slate-200 group-hover:text-violet-300 truncate">${escapeHtml(log.themeName)}</span>
                                    <span class="text-[10px] text-amber-400 font-semibold shrink-0"><i class="fa-solid fa-star text-[9px]"></i> ${Number(log.rating).toFixed(1)}</span>
                                </div>
                                <div class="flex items-center gap-2 shrink-0">
                                    <span class="text-[10px] text-slate-400 hidden sm:inline">${log.playDate}</span>
                                    ${statusBadge}
                                </div>
                            </div>
                        `;
                    }).join('');

                    return `
                        <tr class="hover:bg-slate-900/40 transition cursor-pointer" onclick="toggleStoreThemes('${storeId}')">
                            <td class="py-3 px-3 font-bold text-white flex items-center gap-2">
                                <i id="icon-${storeId}" class="fa-solid fa-chevron-right text-slate-500 text-[10px] transition-transform"></i>
                                <span>${escapeHtml(store)}</span>
                            </td>
                            <td class="py-3 px-3 text-center font-semibold text-slate-300">${stat.total}</td>
                            <td class="py-3 px-3 text-center text-emerald-400 font-bold">${stat.wins}</td>
                            <td class="py-3 px-3 text-center font-semibold text-slate-300">${rate}%</td>
                            <td class="py-3 px-3 text-center text-amber-400 font-bold">★ ${avgR}</td>
                            <td class="py-3 px-3 text-center">
                                <span class="px-2.5 py-1 rounded-lg bg-violet-950/60 border border-violet-800/50 text-violet-300 text-[11px] font-medium hover:bg-violet-900/60 transition inline-flex items-center gap-1">
                                    <i class="fa-solid fa-list-check text-[10px]"></i> ${stat.logs.length}개 테마
                                </span>
                            </td>
                        </tr>
                        <tr id="${storeId}" class="hidden bg-slate-950/40 border-b border-slate-800/80">
                            <td colspan="6" class="p-3 sm:p-4">
                                <div class="space-y-2">
                                    <div class="flex items-center justify-between text-xs font-semibold text-violet-300 mb-1.5 px-1">
                                        <span><i class="fa-solid fa-key text-violet-400 mr-1"></i> [${escapeHtml(store)}] 에서 플레이한 테마 목록 (${stat.logs.length}개)</span>
                                        <span class="text-[10px] text-slate-400 font-normal">테마 클릭시 상세정보 보기</span>
                                    </div>
                                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-2">
                                        ${themeCardsHtml}
                                    </div>
                                </div>
                            </td>
                        </tr>
                    `;
                }).join('');
            }

            // Render Genre Chart
            const genreCounts = {};
            logs.forEach(l => {
                const gs = parseGenres(l);
                gs.forEach(g => {
                    genreCounts[g] = (genreCounts[g] || 0) + 1;
                });
            });

            const genreLabels = Object.keys(genreCounts);
            const genreData = Object.values(genreCounts);

            const ctx = document.getElementById('genreChart').getContext('2d');
            if (genreChartInstance) genreChartInstance.destroy();

            if (genreLabels.length === 0) return;

            genreChartInstance = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: genreLabels,
                    datasets: [{
                        data: genreData,
                        backgroundColor: [
                            '#8b5cf6', '#ec4899', '#f59e0b', '#10b981', 
                            '#06b6d4', '#6366f1', '#f43f5e', '#84cc16'
                        ],
                        borderWidth: 0
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'right',
                            labels: {
                                color: '#cbd5e1',
                                font: { size: 10, family: 'Noto Sans KR' }
                            }
                        }
                    }
                }
            });
        }

        function toggleStoreThemes(storeId) {
            const row = document.getElementById(storeId);
            const icon = document.getElementById(`icon-${storeId}`);
            if (!row) return;
            if (row.classList.contains('hidden')) {
                row.classList.remove('hidden');
                if (icon) icon.classList.add('rotate-90');
            } else {
                row.classList.add('hidden');
                if (icon) icon.classList.remove('rotate-90');
            }
        }

        function exportData() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(logs, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `방탈출_로그북_백업_${new Date().toISOString().split('T')[0]}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        function triggerImport() {
            document.getElementById('importFileInput').click();
        }

        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const imported = JSON.parse(e.target.result);
                    if (Array.isArray(imported)) {
                        if (confirm(`기존 기록 ${logs.length}개에 불러온 ${imported.length}개 기록을 덮어씌우시겠습니까?`)) {
                            logs = imported;
                            saveLogs();
                            updateStats();
                            renderLogs();
                            alert('복원이 완료되었습니다!');
                        }
                    } else {
                        alert('올바르지 않은 JSON 파일 형식입니다.');
                    }
                } catch (err) {
                    alert('파일을 읽는 중 오류가 발생했습니다.');
                }
            };
            reader.readAsText(file);
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }
    </script>
</body>
