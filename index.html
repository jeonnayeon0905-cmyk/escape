<!DOCTYPE html>
<html lang="ko" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>방탈출 나만의 로그북</title>

    <!-- PWA iOS Support -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="방탈출로그">

    <!-- 캐시 방지 메타태그 -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- FontAwesome & Chart.js -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Noto Sans KR', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#f5f3ff',
                            100: '#ede9fe',
                            500: '#8b5cf6',
                            600: '#7c3aed',
                            700: '#6d28d9',
                            900: '#4c1d95',
                            950: '#0f0d1d'
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #0b0914;
            color: #f1f5f9;
            -webkit-tap-highlight-color: transparent;
        }
        .glass-card {
            background: rgba(22, 19, 43, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .glass-modal {
            background: rgba(15, 13, 29, 0.95);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(139, 92, 246, 0.25);
        }
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #0b0914;
        }
        ::-webkit-scrollbar-thumb {
            background: #332a54;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #5b478d;
        }
    </style>
</head>
<body class="min-h-screen pb-20 select-none">

    <header class="sticky top-0 z-30 glass-card border-b border-violet-900/30 px-4 py-3 sm:px-6">
        <div class="max-w-5xl mx-auto flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-violet-600 to-fuchsia-600 flex items-center justify-center text-white shadow-lg shadow-violet-900/40">
                    <i class="fa-solid fa-key text-lg"></i>
                </div>
                <div>
                    <h1 class="text-lg font-extrabold tracking-tight bg-gradient-to-r from-white via-violet-200 to-violet-400 bg-clip-text text-transparent">방탈출 로그북</h1>
                    <p class="text-[11px] text-violet-300/70 font-medium">나만의 리얼 비밀 탈출 기록</p>
                </div>
            </div>

            <div class="flex items-center gap-2">
                <button onclick="forceAppUpdate()" title="최신 버전으로 강제 새로고침" class="px-3 py-1.5 rounded-lg bg-violet-900/60 hover:bg-violet-800 border border-violet-700 text-xs font-semibold text-violet-200 transition flex items-center gap-1.5 active:scale-95">
                    <i class="fa-solid fa-rotate-right text-violet-300"></i>
                    <span class="hidden sm:inline">업데이트</span>
                </button>

                <button onclick="exportData()" title="데이터 내보내기" class="px-3 py-1.5 rounded-lg bg-slate-800/80 hover:bg-slate-700 border border-slate-700 text-xs font-semibold text-slate-200 transition flex items-center gap-1.5">
                    <i class="fa-solid fa-download text-violet-400"></i>
                    <span class="hidden sm:inline">백업</span>
                </button>
                <button onclick="triggerImport()" title="데이터 불러오기" class="px-3 py-1.5 rounded-lg bg-slate-800/80 hover:bg-slate-700 border border-slate-700 text-xs font-semibold text-slate-200 transition flex items-center gap-1.5">
                    <i class="fa-solid fa-upload text-violet-400"></i>
                    <span class="hidden sm:inline">복원</span>
                </button>
                <input type="file" id="importFileInput" accept=".json" class="hidden" onchange="importData(event)">
            </div>
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-4 pt-6 space-y-6">

        <!-- Hero Section: 방탈출 개수 N방 카운터 및 성공/실패 카운트 -->
        <div class="glass-card p-5 sm:p-6 rounded-2xl relative overflow-hidden bg-gradient-to-r from-violet-900/40 via-fuchsia-900/30 to-slate-900/60 border border-violet-500/30 text-center flex flex-col items-center justify-center shadow-xl shadow-violet-950/50">
            <div class="absolute -right-6 -bottom-6 text-violet-500/10 text-9xl font-black pointer-events-none select-none">
                <i class="fa-solid fa-key"></i>
            </div>
            <span class="text-xs sm:text-sm font-bold text-violet-300 tracking-wider uppercase mb-1 flex items-center gap-1.5">
                <i class="fa-solid fa-door-open text-violet-400"></i> 방탈출 개수
            </span>
            <div class="flex items-baseline justify-center gap-1 my-1">
                <span id="heroTotalCount" class="text-4xl sm:text-5xl font-black tracking-tight bg-gradient-to-r from-white via-violet-100 to-fuchsia-200 bg-clip-text text-transparent">0방</span>
            </div>
            <div id="heroSuccessFailCount" class="text-xs sm:text-sm font-medium text-slate-300 mt-1.5 flex items-center gap-2.5 bg-slate-950/60 px-3.5 py-1 rounded-full border border-slate-800">
                <span id="heroSuccessCount" class="text-emerald-400 font-bold flex items-center gap-1"><i class="fa-solid fa-circle-check text-[11px]"></i> 성공 0방</span>
                <span class="text-slate-700">|</span>
                <span id="heroFailCount" class="text-rose-400 font-bold flex items-center gap-1"><i class="fa-solid fa-circle-xmark text-[11px]"></i> 실패 0방</span>
            </div>
        </div>

        <section class="grid grid-cols-2 sm:grid-cols-4 gap-3">
            <div class="glass-card p-4 rounded-2xl flex flex-col justify-between relative overflow-hidden group">
                <div class="absolute -right-2 -bottom-2 text-violet-500/10 text-6xl font-black group-hover:scale-110 transition"><i class="fa-solid fa-door-open"></i></div>
                <span class="text-xs font-semibold text-violet-300/80">총 도전 횟수</span>
                <div class="mt-2 flex items-baseline gap-1">
                    <span id="statTotal" class="text-2xl font-black text-white">0</span>
                    <span class="text-xs text-slate-400">회</span>
                </div>
            </div>

            <div class="glass-card p-4 rounded-2xl flex flex-col justify-between relative overflow-hidden group">
                <div class="absolute -right-2 -bottom-2 text-emerald-500/10 text-6xl font-black group-hover:scale-110 transition"><i class="fa-solid fa-trophy"></i></div>
                <span class="text-xs font-semibold text-violet-300/80">탈출 성공률</span>
                <div class="mt-2 flex items-baseline gap-1">
                    <span id="statSuccessRate" class="text-2xl font-black text-emerald-400">0%</span>
                    <span id="statSuccessCount" class="text-[11px] text-slate-400">(0승 0패)</span>
                </div>
            </div>

            <div class="glass-card p-4 rounded-2xl flex flex-col justify-between relative overflow-hidden group">
                <div class="absolute -right-2 -bottom-2 text-amber-500/10 text-6xl font-black group-hover:scale-110 transition"><i class="fa-solid fa-lightbulb"></i></div>
                <span class="text-xs font-semibold text-violet-300/80">평균 힌트</span>
                <div class="mt-2 flex items-baseline gap-1">
                    <span id="statAvgHints" class="text-2xl font-black text-amber-300">-</span>
                    <span class="text-xs text-slate-400">개</span>
                </div>
            </div>

            <div class="glass-card p-4 rounded-2xl flex flex-col justify-between relative overflow-hidden group">
                <div class="absolute -right-2 -bottom-2 text-fuchsia-500/10 text-6xl font-black group-hover:scale-110 transition"><i class="fa-solid fa-star"></i></div>
                <span class="text-xs font-semibold text-violet-300/80">평균 만족도</span>
                <div class="mt-2 flex items-baseline gap-1">
                    <span id="statAvgRating" class="text-2xl font-black text-fuchsia-300">0.0</span>
                    <span class="text-xs text-slate-400">/ 5.0</span>
                </div>
            </div>
        </section>

        <section class="glass-card p-4 rounded-2xl space-y-4">
            <div class="flex items-center justify-between border-b border-slate-800 pb-3">
                <div class="flex items-center gap-2 bg-slate-900/90 p-1 rounded-xl border border-slate-800">
                    <button id="tabListBtn" onclick="switchTab('list')" class="px-4 py-1.5 rounded-lg text-xs font-bold transition bg-violet-600 text-white shadow">
                        <i class="fa-solid fa-list-ul mr-1.5"></i>기록 목록
                    </button>
                    <button id="tabStatsBtn" onclick="switchTab('stats')" class="px-4 py-1.5 rounded-lg text-xs font-bold transition text-slate-400 hover:text-white">
                        <i class="fa-solid fa-chart-pie mr-1.5"></i>통계 & 카페 분석
                    </button>
                </div>

                <div id="logCountBadge" class="text-xs font-medium text-slate-400">
                    총 <span id="filteredCount" class="text-violet-400 font-bold">0</span>개 기록
                </div>
            </div>

            <div id="filterControls" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-2.5">
                <div class="relative">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-500 text-xs"></i>
                    <input type="text" id="searchInput" placeholder="테마, 카페, 주소, 동행인 검색..." class="w-full bg-slate-950 border border-slate-800 rounded-xl pl-9 pr-3 py-2 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-violet-500 transition">
                </div>

                <select id="storeFilter" class="bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-violet-500 transition">
                    <option value="ALL">전체 방탈출 카페</option>
                </select>

                <select id="genreFilter" class="bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-violet-500 transition">
                    <option value="ALL">전체 장르</option>
                    <option value="공포">공포</option>
                    <option value="스릴러">스릴러</option>
                    <option value="감성/드라마">감성/드라마</option>
                    <option value="추리/미스터리">추리/미스터리</option>
                    <option value="코믹">코믹</option>
                    <option value="SF/판타지">SF/판타지</option>
                    <option value="모험/액션">모험/액션</option>
                    <option value="야외">야외</option>
                    <option value="???">???</option>
                    <option value="기타">기타</option>
                </select>

                <select id="sortFilter" class="bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-violet-500 transition">
                    <option value="DATE_DESC">⏱️ 최신순 (기본)</option>
                    <option value="DATE_ASC">⏳ 오래된 순</option>
                    <option value="RATING_DESC">⭐ 평점 높은 순</option>
                    <option value="SUCCESS_ONLY">🎉 성공한 테마만</option>
                    <option value="FAIL_ONLY">💀 실패한 테마만</option>
                </select>
            </div>
        </section>

        <section id="viewList" class="space-y-4">
            <!-- 새로운 탈출 기록 버튼 (기록 목록 상단으로 이동) -->
            <div class="flex justify-center sm:justify-end">
                <button onclick="openModal(false)" class="w-full sm:w-auto px-6 py-3 rounded-xl bg-gradient-to-r from-violet-600 via-fuchsia-600 to-pink-600 hover:from-violet-500 hover:to-pink-500 text-white font-extrabold text-xs shadow-lg shadow-violet-900/50 hover:shadow-violet-700/70 transition-all duration-200 flex items-center justify-center gap-2 active:scale-95 cursor-pointer border border-violet-400/30">
                    <i class="fa-solid fa-plus-circle text-sm"></i>
                    <span>새로운 탈출 기록 작성</span>
                </button>
            </div>

            <div id="logsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3.5">
            </div>

            <div id="emptyState" class="hidden glass-card p-12 rounded-2xl text-center space-y-3">
                <div class="w-16 h-16 rounded-full bg-slate-900 border border-slate-800 text-slate-600 flex items-center justify-center mx-auto text-2xl">
                    <i class="fa-solid fa-ghost"></i>
                </div>
                <h3 class="text-base font-bold text-slate-300">기록된 방탈출이 없습니다</h3>
                <p class="text-xs text-slate-500 max-w-sm mx-auto">상단의 '새로운 탈출 기록 작성' 버튼을 눌러 소중한 탈출 기록을 저장해보세요!</p>
            </div>
        </section>

        <section id="viewStats" class="hidden space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="glass-card p-5 rounded-2xl space-y-4">
                    <div class="flex items-center justify-between border-b border-slate-800 pb-3">
                        <h3 class="text-sm font-bold text-violet-300 flex items-center gap-2">
                            <i class="fa-solid fa-store text-violet-400"></i> 자주 찾은 방탈출 카페 TOP 5
                        </h3>
                    </div>
                    <div id="topStoresList" class="space-y-3">
                    </div>
                </div>

                <div class="glass-card p-5 rounded-2xl space-y-4 flex flex-col justify-between">
                    <h3 class="text-sm font-bold text-violet-300 flex items-center gap-2 border-b border-slate-800 pb-3">
                        <i class="fa-solid fa-masks-theater text-fuchsia-400"></i> 선호 장르 분포
                    </h3>
                    <div class="relative h-52 flex items-center justify-center">
                        <canvas id="genreChart"></canvas>
                    </div>
                </div>
            </div>

            <!-- 매장별 플레이 테마 상세 분석 테이블 -->
            <div class="glass-card p-5 rounded-2xl space-y-4">
                <div class="flex items-center justify-between border-b border-slate-800 pb-3">
                    <h3 class="text-sm font-bold text-violet-300 flex items-center gap-2">
                        <i class="fa-solid fa-building-columns text-emerald-400"></i> 매장별 상세 기록 및 진행 테마 목록
                    </h3>
                    <span class="text-[11px] text-slate-400">카페를 클릭하여 플레이한 테마 확인</span>
                </div>
                <div id="storeAnalysisAccordion" class="space-y-2">
                </div>
            </div>
        </section>

    </main>

    <div id="logModal" class="fixed inset-0 z-50 flex items-center justify-center p-3 sm:p-4 bg-black/80 backdrop-blur-md hidden overflow-y-auto">
        <div class="glass-modal w-full max-w-xl rounded-2xl p-5 sm:p-6 my-auto shadow-2xl relative max-h-[90vh] overflow-y-auto">
            <button onclick="closeModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white transition w-8 h-8 rounded-full bg-slate-900 border border-slate-800 flex items-center justify-center">
                <i class="fa-solid fa-xmark text-sm"></i>
            </button>

            <h2 id="modalTitle" class="text-base font-bold text-white mb-5 flex items-center gap-2">
                <i class="fa-solid fa-key text-violet-400"></i> 새 방탈출 기록하기
            </h2>

            <form id="logForm" onsubmit="handleFormSubmit(event)" class="space-y-4 text-xs">
                <input type="hidden" id="editLogId">

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                        <label class="block font-semibold text-slate-300 mb-1">방탈출 카페(매장명) <span class="text-rose-400">*</span></label>
                        <input type="text" id="storeName" required placeholder="예: 키링키링 강남점" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-violet-500 transition">
                    </div>
                    <div>
                        <label class="block font-semibold text-slate-300 mb-1"><i class="fa-solid fa-location-dot text-violet-400 mr-1"></i>매장 주소 / 위치</label>
                        <input type="text" id="storeAddress" placeholder="예: 서울 강남구 강남대로 123" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-violet-500 transition">
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                        <label class="block font-semibold text-slate-300 mb-1">테마명 <span class="text-rose-400">*</span></label>
                        <input type="text" id="themeName" required placeholder="예: 비밀의 화원" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-violet-500 transition">
                    </div>
                    <div>
                        <label class="block font-semibold text-slate-300 mb-1">플레이 날짜 <span class="text-rose-400">*</span></label>
                        <input type="date" id="playDate" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-violet-500 transition">
                    </div>
                </div>

                <!-- 탈출 성공 / 실패 선택 radio -->
                <div>
                    <label class="block font-semibold text-slate-300 mb-1.5">탈출 결과 <span class="text-rose-400">*</span></label>
                    <div class="grid grid-cols-2 gap-3">
                        <label class="flex items-center justify-center gap-2 p-2.5 rounded-xl bg-slate-950 border border-slate-800 cursor-pointer hover:border-emerald-500/50 transition has-[:checked]:bg-emerald-950/40 has-[:checked]:border-emerald-500 has-[:checked]:text-emerald-400">
                            <input type="radio" name="isSuccess" value="true" checked class="accent-emerald-500">
                            <span class="font-bold flex items-center gap-1.5 text-emerald-400"><i class="fa-solid fa-circle-check"></i> 탈출 성공</span>
                        </label>
                        <label class="flex items-center justify-center gap-2 p-2.5 rounded-xl bg-slate-950 border border-slate-800 cursor-pointer hover:border-rose-500/50 transition has-[:checked]:bg-rose-950/40 has-[:checked]:border-rose-500 has-[:checked]:text-rose-400">
                            <input type="radio" name="isSuccess" value="false" class="accent-rose-500">
                            <span class="font-bold flex items-center gap-1.5 text-rose-400"><i class="fa-solid fa-circle-xmark"></i> 탈출 실패</span>
                        </label>
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                    <div>
                        <label class="block font-semibold text-slate-300 mb-1">장르</label>
                        <select id="genre" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-violet-500 transition">
                            <option value="공포">공포</option>
                            <option value="스릴러">스릴러</option>
                            <option value="감성/드라마">감성/드라마</option>
                            <option value="추리/미스터리" selected>추리/미스터리</option>
                            <option value="코믹">코믹</option>
                            <option value="SF/판타지">SF/판타지</option>
                            <option value="모험/액션">모험/액션</option>
                            <option value="야외">야외</option>
                            <option value="???">???</option>
                            <option value="기타">기타</option>
                        </select>
                    </div>

                    <div>
                        <label class="block font-semibold text-slate-300 mb-1">남은 시간 / 기록</label>
                        <input type="text" id="remainingTime" placeholder="예: 12분 30초 남음" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-violet-500 transition">
                    </div>

                    <div>
                        <label class="block font-semibold text-slate-300 mb-1">사용 힌트 수</label>
                        <input type="text" id="hintsUsed" placeholder="예: 1개 or 노힌트" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-violet-500 transition">
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                        <label class="block font-semibold text-slate-300 mb-1">만족도 평점 (5점 만점)</label>
                        <select id="rating" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-amber-400 font-bold focus:outline-none focus:border-violet-500 transition">
                            <option value="5.0">⭐⭐⭐⭐⭐ 5.0 (최고의 인생 테마)</option>
                            <option value="4.5">⭐⭐⭐⭐½ 4.5 (매우 재미있음)</option>
                            <option value="4.0" selected>⭐⭐⭐⭐ 4.0 (추천함)</option>
                            <option value="3.5">⭐⭐⭐½ 3.5 (무난함)</option>
                            <option value="3.0">⭐⭐⭐ 3.0 (보통)</option>
                            <option value="2.0">⭐⭐ 2.0 (아쉬움)</option>
                            <option value="1.0">⭐ 1.0 (비추천)</option>
                        </select>
                    </div>

                    <div>
                        <label class="block font-semibold text-slate-300 mb-1">함께한 동행인 (쉼표 구별)</label>
                        <input type="text" id="companions" placeholder="예: 홍길동, 김철수" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-violet-500 transition">
                    </div>
                </div>

                <div>
                    <label class="block font-semibold text-slate-300 mb-1">후기 및 메모</label>
                    <textarea id="reviewText" rows="3" placeholder="연출, 인테리어, 활동성, 난이도 등 생각나는 후기를 기록하세요." class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-white focus:outline-none focus:border-violet-500 transition resize-none"></textarea>
                </div>

                <div class="flex items-center justify-end gap-2 pt-2 border-t border-slate-800">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold transition">취소</button>
                    <button type="submit" class="px-5 py-2 rounded-xl bg-gradient-to-r from-violet-600 to-fuchsia-600 hover:from-violet-500 hover:to-fuchsia-500 text-white font-bold shadow-lg shadow-violet-900/50 transition">저장하기</button>
                </div>
            </form>
        </div>
    </div>

    <div id="detailModal" class="fixed inset-0 z-50 flex items-center justify-center p-3 sm:p-4 bg-black/80 backdrop-blur-md hidden overflow-y-auto">
        <div class="glass-modal w-full max-w-lg rounded-2xl p-5 sm:p-6 my-auto shadow-2xl relative max-h-[90vh] overflow-y-auto">
            <button onclick="closeDetailModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white transition w-8 h-8 rounded-full bg-slate-900 border border-slate-800 flex items-center justify-center">
                <i class="fa-solid fa-xmark text-sm"></i>
            </button>

            <div id="detailContent" class="space-y-4">
            </div>
        </div>
    </div>

    <div id="messageToast" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 px-5 py-2.5 rounded-full glass-modal border border-violet-500/50 text-white text-xs font-bold shadow-2xl transition duration-300 opacity-0 pointer-events-none translate-y-4 flex items-center gap-2">
        <i id="toastIcon" class="fa-solid fa-circle-check text-emerald-400"></i>
        <span id="toastMessage">메시지</span>
    </div>

    <script>
        // Data State
        let logs = JSON.parse(localStorage.getItem('escape_logs') || '[]');
        let genreChartInstance = null;

        // Initial Sample Data if empty
        if (logs.length === 0) {
            logs = [
                {
                    id: 'sample-1',
                    storeName: '키링키링 강남점',
                    storeAddress: '서울 강남구 강남대로 390',
                    themeName: '비밀의 화원',
                    playDate: '2026-08-20',
                    isSuccess: true,
                    genre: '감성/드라마',
                    remainingTime: '15분 40초 남음',
                    hintsUsed: '1개',
                    rating: '4.5',
                    companions: '민수, 지은',
                    reviewText: '인테리어가 너무 예쁘고 스토리 몰입감이 최고였습니다! 강추해요.'
                },
                {
                    id: 'sample-2',
                    storeName: '넥스트에디션 건대점',
                    storeAddress: '서울 광진구 아차산로 210',
                    themeName: '심야식당',
                    playDate: '2026-08-10',
                    isSuccess: false,
                    genre: '추리/미스터리',
                    remainingTime: '시간초과',
                    hintsUsed: '4개',
                    rating: '3.5',
                    companions: '영희',
                    reviewText: '마지막 문제에서 시간이 약간 부족했네요. 연출은 흥미로웠습니다.'
                }
            ];
            saveLogs();
        }

        function saveLogs() {
            localStorage.setItem('escape_logs', JSON.stringify(logs));
        }

        // DOM Ready Initializer
        window.onload = function() {
            updateDashboard();
            renderLogs();
            populateStoreFilter();

            // Event listeners for realtime filters
            document.getElementById('searchInput').addEventListener('input', renderLogs);
            document.getElementById('storeFilter').addEventListener('change', renderLogs);
            document.getElementById('genreFilter').addEventListener('change', renderLogs);
            document.getElementById('sortFilter').addEventListener('change', renderLogs);
        };

        function updateDashboard() {
            const totalCount = logs.length;
            const successCount = logs.filter(l => l.isSuccess).length;
            const failCount = totalCount - successCount;
            const successRate = totalCount > 0 ? Math.round((successCount / totalCount) * 100) : 0;

            // Hero total count update ("N방")
            document.getElementById('heroTotalCount').textContent = `${totalCount}방`;
            document.getElementById('heroSuccessCount').innerHTML = `<i class="fa-solid fa-circle-check text-[11px]"></i> 성공 ${successCount}방`;
            document.getElementById('heroFailCount').innerHTML = `<i class="fa-solid fa-circle-xmark text-[11px]"></i> 실패 ${failCount}방`;

            // Stat Cards update
            document.getElementById('statTotal').textContent = totalCount;
            document.getElementById('statSuccessRate').textContent = `${successRate}%`;
            document.getElementById('statSuccessCount').textContent = `(${successCount}승 ${failCount}패)`;

            // Avg Rating
            if (totalCount > 0) {
                const totalRating = logs.reduce((sum, l) => sum + parseFloat(l.rating || 0), 0);
                document.getElementById('statAvgRating').textContent = (totalRating / totalCount).toFixed(1);
            } else {
                document.getElementById('statAvgRating').textContent = '0.0';
            }

            // Avg Hints
            let hintSum = 0;
            let validHintCount = 0;
            logs.forEach(l => {
                if (l.hintsUsed) {
                    const match = l.hintsUsed.match(/\d+/);
                    if (match) {
                        hintSum += parseInt(match[0], 10);
                        validHintCount++;
                    } else if (l.hintsUsed.includes('노힌트') || l.hintsUsed.includes('0')) {
                        validHintCount++;
                    }
                }
            });
            document.getElementById('statAvgHints').textContent = validHintCount > 0 ? (hintSum / validHintCount).toFixed(1) : '-';
        }

        function renderLogs() {
            const search = document.getElementById('searchInput').value.trim().toLowerCase();
            const selectedStore = document.getElementById('storeFilter').value;
            const selectedGenre = document.getElementById('genreFilter').value;
            const selectedSort = document.getElementById('sortFilter').value;

            let filtered = logs.filter(item => {
                const matchSearch = !search || 
                    item.themeName.toLowerCase().includes(search) || 
                    item.storeName.toLowerCase().includes(search) ||
                    (item.storeAddress && item.storeAddress.toLowerCase().includes(search)) ||
                    (item.companions && item.companions.toLowerCase().includes(search)) ||
                    (item.reviewText && item.reviewText.toLowerCase().includes(search));

                const matchStore = selectedStore === 'ALL' || item.storeName === selectedStore;
                const matchGenre = selectedGenre === 'ALL' || item.genre === selectedGenre;

                return matchSearch && matchStore && matchGenre;
            });

            // Sorting logic
            if (selectedSort === 'DATE_DESC') {
                filtered.sort((a, b) => new Date(b.playDate) - new Date(a.playDate));
            } else if (selectedSort === 'DATE_ASC') {
                filtered.sort((a, b) => new Date(a.playDate) - new Date(b.playDate));
            } else if (selectedSort === 'RATING_DESC') {
                filtered.sort((a, b) => parseFloat(b.rating || 0) - parseFloat(a.rating || 0));
            } else if (selectedSort === 'SUCCESS_ONLY') {
                filtered = filtered.filter(l => l.isSuccess);
            } else if (selectedSort === 'FAIL_ONLY') {
                filtered = filtered.filter(l => !l.isSuccess);
            }

            document.getElementById('filteredCount').textContent = filtered.length;
            const grid = document.getElementById('logsGrid');
            const emptyState = document.getElementById('emptyState');

            if (filtered.length === 0) {
                grid.innerHTML = '';
                emptyState.classList.remove('hidden');
                return;
            }

            emptyState.classList.add('hidden');
            grid.innerHTML = filtered.map(log => `
                <div class="glass-card rounded-2xl p-4 flex flex-col justify-between hover:border-violet-500/40 transition duration-200 relative group">
                    <div>
                        <div class="flex items-center justify-between gap-2 mb-2">
                            <span class="px-2.5 py-0.5 rounded-full text-[10px] font-bold tracking-wide ${log.isSuccess ? 'bg-emerald-950/80 text-emerald-400 border border-emerald-500/30' : 'bg-rose-950/80 text-rose-400 border border-rose-500/30'}">
                                ${log.isSuccess ? '<i class="fa-solid fa-circle-check"></i> 탈출 성공' : '<i class="fa-solid fa-circle-xmark"></i> 탈출 실패'}
                            </span>
                            <span class="text-[11px] font-semibold text-violet-300/80">${log.genre || '장르 미지정'}</span>
                        </div>

                        <h3 class="text-base font-extrabold text-white tracking-tight group-hover:text-violet-300 transition line-clamp-1 mb-1">${escapeHtml(log.themeName)}</h3>
                        <p class="text-xs font-semibold text-slate-300 line-clamp-1 mb-1">
                            <i class="fa-solid fa-store text-violet-400 mr-1"></i>${escapeHtml(log.storeName)}
                        </p>

                        ${log.storeAddress ? `
                            <p class="text-[11px] text-slate-400 line-clamp-1 mb-2">
                                <i class="fa-solid fa-location-dot text-violet-400/80 mr-1"></i>${escapeHtml(log.storeAddress)}
                            </p>
                        ` : ''}

                        <div class="flex items-center gap-2 text-[11px] text-slate-400 mb-3">
                            <span><i class="fa-regular fa-calendar text-slate-500 mr-1"></i>${log.playDate}</span>
                            <span>•</span>
                            <span class="text-amber-400 font-bold"><i class="fa-solid fa-star text-xs"></i> ${log.rating || '0.0'}</span>
                        </div>

                        ${log.reviewText ? `
                            <p class="text-xs text-slate-300 bg-slate-950/50 p-2.5 rounded-xl border border-slate-800/80 line-clamp-2 mb-3">
                                "${escapeHtml(log.reviewText)}"
                            </p>
                        ` : ''}
                    </div>

                    <div class="pt-2 border-t border-slate-800/80 flex items-center justify-between text-xs">
                        <div class="flex items-center gap-1.5 text-slate-400 text-[11px]">
                            ${log.remainingTime ? `<span class="bg-slate-900 px-2 py-0.5 rounded border border-slate-800"><i class="fa-regular fa-clock mr-1"></i>${escapeHtml(log.remainingTime)}</span>` : ''}
                            ${log.hintsUsed ? `<span class="bg-slate-900 px-2 py-0.5 rounded border border-slate-800"><i class="fa-regular fa-lightbulb text-amber-400 mr-1"></i>${escapeHtml(log.hintsUsed)}</span>` : ''}
                        </div>

                        <div class="flex items-center gap-1">
                            <button onclick="openDetailModal('${log.id}')" title="상세보기" class="px-2 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 transition">
                                <i class="fa-solid fa-eye"></i>
                            </button>
                            <button onclick="openModal(true, '${log.id}')" title="기록 수정" class="px-2.5 py-1 rounded-lg bg-violet-900/60 hover:bg-violet-800 border border-violet-700/80 text-violet-200 font-bold transition flex items-center gap-1">
                                <i class="fa-solid fa-pen-to-square"></i>
                                <span>수정</span>
                            </button>
                            <button onclick="deleteLog('${log.id}')" title="삭제" class="px-2 py-1 rounded-lg bg-rose-950/60 hover:bg-rose-900 border border-rose-800/80 text-rose-300 transition">
                                <i class="fa-solid fa-trash"></i>
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function populateStoreFilter() {
            const filterSelect = document.getElementById('storeFilter');
            const stores = [...new Set(logs.map(l => l.storeName))].filter(Boolean).sort();

            filterSelect.innerHTML = '<option value="ALL">전체 방탈출 카페</option>' + 
                stores.map(s => `<option value="${escapeHtml(s)}">${escapeHtml(s)}</option>`).join('');
        }

        function renderStatsView() {
            // Render TOP 5 Stores
            const storeCounts = {};
            logs.forEach(l => {
                storeCounts[l.storeName] = (storeCounts[l.storeName] || 0) + 1;
            });

            const sortedStores = Object.entries(storeCounts)
                .sort((a, b) => b[1] - a[1])
                .slice(0, 5);

            const topStoresList = document.getElementById('topStoresList');
            if (sortedStores.length === 0) {
                topStoresList.innerHTML = '<p class="text-xs text-slate-500 text-center py-4">방문 기록이 없습니다.</p>';
            } else {
                topStoresList.innerHTML = sortedStores.map(([store, count], idx) => {
                    const storeThemes = logs.filter(l => l.storeName === store);
                    return `
                        <div class="bg-slate-950/60 p-3 rounded-xl border border-slate-800/80 space-y-2">
                            <div class="flex items-center justify-between">
                                <div class="flex items-center gap-2">
                                    <span class="w-5 h-5 rounded-full ${idx === 0 ? 'bg-amber-500 text-slate-950' : 'bg-slate-800 text-slate-300'} font-black text-xs flex items-center justify-center">${idx + 1}</span>
                                    <span class="font-bold text-xs text-white">${escapeHtml(store)}</span>
                                </div>
                                <span class="text-xs font-extrabold text-violet-400">${count}회 방문</span>
                            </div>
                            <div class="flex flex-wrap gap-1.5 pt-1 border-t border-slate-900">
                                ${storeThemes.map(t => `
                                    <span onclick="openDetailModal('${t.id}')" class="cursor-pointer px-2 py-0.5 rounded text-[10px] font-semibold ${t.isSuccess ? 'bg-emerald-950/80 text-emerald-300 border border-emerald-800/50' : 'bg-rose-950/80 text-rose-300 border border-rose-800/50'} hover:opacity-80 transition">
                                        ${t.isSuccess ? '✓' : '✗'} ${escapeHtml(t.themeName)}
                                    </span>
                                `).join('')}
                            </div>
                        </div>
                    `;
                }).join('');
            }

            // Render Genre Chart
            const genreCounts = {};
            logs.forEach(l => {
                const g = l.genre || '기타';
                genreCounts[g] = (genreCounts[g] || 0) + 1;
            });

            const ctx = document.getElementById('genreChart').getContext('2d');
            if (genreChartInstance) genreChartInstance.destroy();

            const labels = Object.keys(genreCounts);
            const dataValues = Object.values(genreCounts);

            genreChartInstance = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: labels,
                    datasets: [{
                        data: dataValues,
                        backgroundColor: [
                            '#8b5cf6', '#ec4899', '#f59e0b', '#10b981', 
                            '#3b82f6', '#6366f1', '#14b8a6', '#f43f5e'
                        ],
                        borderWidth: 0
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'right',
                            labels: {
                                color: '#cbd5e1',
                                font: { family: 'Noto Sans KR', size: 11 }
                            }
                        }
                    }
                }
            });

            // Render Detailed Store Accordion List
            const storeGrouped = {};
            logs.forEach(l => {
                if (!storeGrouped[l.storeName]) {
                    storeGrouped[l.storeName] = [];
                }
                storeGrouped[l.storeName].push(l);
            });

            const storeAccordion = document.getElementById('storeAnalysisAccordion');
            const storeNames = Object.keys(storeGrouped).sort();

            if (storeNames.length === 0) {
                storeAccordion.innerHTML = '<p class="text-xs text-slate-500 text-center py-4">분석할 카페 데이터가 없습니다.</p>';
                return;
            }

            storeAccordion.innerHTML = storeNames.map(sName => {
                const sLogs = storeGrouped[sName];
                const total = sLogs.length;
                const succ = sLogs.filter(l => l.isSuccess).length;
                const rate = Math.round((succ / total) * 100);
                const avgRate = (sLogs.reduce((acc, curr) => acc + parseFloat(curr.rating || 0), 0) / total).toFixed(1);

                return `
                    <div class="bg-slate-950/80 rounded-xl border border-slate-800 overflow-hidden">
                        <div class="p-3 flex items-center justify-between cursor-pointer hover:bg-slate-900/60 transition" onclick="toggleStoreAccordion('${escapeHtml(sName)}')">
                            <div class="space-y-0.5">
                                <h4 class="font-extrabold text-xs text-white flex items-center gap-2">
                                    <i class="fa-solid fa-store text-violet-400"></i>${escapeHtml(sName)}
                                </h4>
                                ${sLogs[0].storeAddress ? `<p class="text-[10px] text-slate-400"><i class="fa-solid fa-location-dot mr-1"></i>${escapeHtml(sLogs[0].storeAddress)}</p>` : ''}
                            </div>
                            <div class="flex items-center gap-3 text-xs">
                                <span class="text-slate-300 font-semibold">${total}회 플레이</span>
                                <span class="text-emerald-400 font-bold">${succ}승 (${rate}%)</span>
                                <span class="text-amber-400 font-bold"><i class="fa-solid fa-star text-[10px]"></i> ${avgRate}</span>
                                <i id="accordionIcon-${escapeHtml(sName)}" class="fa-solid fa-chevron-down text-slate-500 text-xs transition-transform"></i>
                            </div>
                        </div>

                        <!-- Expandable Themes Area -->
                        <div id="accordionContent-${escapeHtml(sName)}" class="p-3 bg-slate-900/50 border-t border-slate-800/60 space-y-2">
                            <p class="text-[11px] font-bold text-violet-300 mb-1">🎮 플레이한 테마 목록 (${total}개)</p>
                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                                ${sLogs.map(tl => `
                                    <div onclick="openDetailModal('${tl.id}')" class="p-2.5 rounded-lg bg-slate-950 border border-slate-800/80 hover:border-violet-500/50 cursor-pointer transition flex items-center justify-between">
                                        <div>
                                            <div class="flex items-center gap-1.5 mb-1">
                                                <span class="px-1.5 py-0.2 rounded text-[9px] font-bold ${tl.isSuccess ? 'bg-emerald-950 text-emerald-400 border border-emerald-800' : 'bg-rose-950 text-rose-400 border border-rose-800'}">
                                                    ${tl.isSuccess ? '성공' : '실패'}
                                                </span>
                                                <span class="font-bold text-xs text-white">${escapeHtml(tl.themeName)}</span>
                                            </div>
                                            <p class="text-[10px] text-slate-400">${tl.playDate} • ${tl.genre || '기타'}</p>
                                        </div>
                                        <span class="text-amber-400 font-bold text-xs"><i class="fa-solid fa-star text-[10px]"></i> ${tl.rating || '0.0'}</span>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function toggleStoreAccordion(storeName) {
            const content = document.getElementById(`accordionContent-${storeName}`);
            const icon = document.getElementById(`accordionIcon-${storeName}`);
            if (content.classList.contains('hidden')) {
                content.classList.remove('hidden');
                icon.classList.add('rotate-180');
            } else {
                content.classList.add('hidden');
                icon.classList.remove('rotate-180');
            }
        }

        function switchTab(tab) {
            const listBtn = document.getElementById('tabListBtn');
            const statsBtn = document.getElementById('tabStatsBtn');
            const viewList = document.getElementById('viewList');
            const viewStats = document.getElementById('viewStats');
            const filterControls = document.getElementById('filterControls');

            if (tab === 'list') {
                listBtn.className = 'px-4 py-1.5 rounded-lg text-xs font-bold transition bg-violet-600 text-white shadow';
                statsBtn.className = 'px-4 py-1.5 rounded-lg text-xs font-bold transition text-slate-400 hover:text-white';
                viewList.classList.remove('hidden');
                viewStats.classList.add('hidden');
                filterControls.classList.remove('hidden');
            } else {
                statsBtn.className = 'px-4 py-1.5 rounded-lg text-xs font-bold transition bg-violet-600 text-white shadow';
                listBtn.className = 'px-4 py-1.5 rounded-lg text-xs font-bold transition text-slate-400 hover:text-white';
                viewList.classList.add('hidden');
                viewStats.classList.remove('hidden');
                filterControls.classList.add('hidden');
                renderStatsView();
            }
        }

        function openModal(isEdit = false, logId = null) {
            const modal = document.getElementById('logModal');
            const form = document.getElementById('logForm');
            const title = document.getElementById('modalTitle');

            form.reset();
            document.getElementById('editLogId').value = '';

            if (isEdit && logId) {
                const log = logs.find(l => l.id === logId);
                if (log) {
                    title.innerHTML = '<i class="fa-solid fa-pen-to-square text-violet-400"></i> 방탈출 기록 수정하기';
                    document.getElementById('editLogId').value = log.id;
                    document.getElementById('storeName').value = log.storeName || '';
                    document.getElementById('storeAddress').value = log.storeAddress || '';
                    document.getElementById('themeName').value = log.themeName || '';
                    document.getElementById('playDate').value = log.playDate || '';
                    document.getElementById('genre').value = log.genre || '추리/미스터리';
                    document.getElementById('remainingTime').value = log.remainingTime || '';
                    document.getElementById('hintsUsed').value = log.hintsUsed || '';
                    document.getElementById('rating').value = log.rating || '4.0';
                    document.getElementById('companions').value = log.companions || '';
                    document.getElementById('reviewText').value = log.reviewText || '';

                    const radios = form.elements['isSuccess'];
                    for (let r of radios) {
                        r.checked = (r.value === String(log.isSuccess));
                    }
                }
            } else {
                title.innerHTML = '<i class="fa-solid fa-key text-violet-400"></i> 새 방탈출 기록하기';
                document.getElementById('playDate').valueAsDate = new Date();
            }

            modal.classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('logModal').classList.add('hidden');
        }

        function handleFormSubmit(e) {
            e.preventDefault();
            const editId = document.getElementById('editLogId').value;

            const newLog = {
                id: editId || 'log-' + Date.now(),
                storeName: document.getElementById('storeName').value.trim(),
                storeAddress: document.getElementById('storeAddress').value.trim(),
                themeName: document.getElementById('themeName').value.trim(),
                playDate: document.getElementById('playDate').value,
                isSuccess: document.querySelector('input[name="isSuccess"]:checked').value === 'true',
                genre: document.getElementById('genre').value,
                remainingTime: document.getElementById('remainingTime').value.trim(),
                hintsUsed: document.getElementById('hintsUsed').value.trim(),
                rating: document.getElementById('rating').value,
                companions: document.getElementById('companions').value.trim(),
                reviewText: document.getElementById('reviewText').value.trim()
            };

            if (editId) {
                const idx = logs.findIndex(l => l.id === editId);
                if (idx !== -1) logs[idx] = newLog;
                showToast('기록이 수정되었습니다!');
            } else {
                logs.unshift(newLog);
                showToast('새 방탈출 기록이 등록되었습니다!');
            }

            saveLogs();
            updateDashboard();
            populateStoreFilter();
            renderLogs();
            closeModal();
        }

        function openDetailModal(id) {
            const log = logs.find(l => l.id === id);
            if (!log) return;

            const content = document.getElementById('detailContent');
            content.innerHTML = `
                <div class="space-y-4">
                    <div class="flex items-center justify-between gap-2 border-b border-slate-800 pb-3">
                        <span class="px-3 py-1 rounded-full text-xs font-bold ${log.isSuccess ? 'bg-emerald-950 text-emerald-400 border border-emerald-500/30' : 'bg-rose-950 text-rose-400 border border-rose-500/30'}">
                            ${log.isSuccess ? '✓ 탈출 성공' : '✗ 탈출 실패'}
                        </span>
                        <span class="text-xs font-bold text-violet-300">${log.genre || '장르 미지정'}</span>
                    </div>

                    <div>
                        <h2 class="text-xl font-extrabold text-white">${escapeHtml(log.themeName)}</h2>
                        <p class="text-sm font-semibold text-slate-300 mt-1">
                            <i class="fa-solid fa-store text-violet-400 mr-1.5"></i>${escapeHtml(log.storeName)}
                        </p>
                        ${log.storeAddress ? `
                            <p class="text-xs text-slate-400 mt-1">
                                <i class="fa-solid fa-location-dot text-violet-400 mr-1.5"></i>${escapeHtml(log.storeAddress)}
                            </p>
                        ` : ''}
                    </div>

                    <div class="grid grid-cols-2 gap-2 bg-slate-950/80 p-3 rounded-xl border border-slate-800 text-xs">
                        <div>
                            <span class="text-slate-400">플레이 날짜:</span>
                            <p class="font-bold text-white mt-0.5">${log.playDate}</p>
                        </div>
                        <div>
                            <span class="text-slate-400">만족도 평점:</span>
                            <p class="font-bold text-amber-400 mt-0.5">⭐ ${log.rating || '0.0'} / 5.0</p>
                        </div>
                        <div>
                            <span class="text-slate-400">기록 / 남은시간:</span>
                            <p class="font-bold text-white mt-0.5">${log.remainingTime || '-'}</p>
                        </div>
                        <div>
                            <span class="text-slate-400">사용 힌트 수:</span>
                            <p class="font-bold text-amber-300 mt-0.5">${log.hintsUsed || '-'}</p>
                        </div>
                    </div>

                    ${log.companions ? `
                        <div>
                            <span class="text-xs font-semibold text-slate-400 block mb-1">함께한 동행인</span>
                            <div class="flex flex-wrap gap-1.5">
                                ${log.companions.split(',').map(c => `<span class="px-2.5 py-1 bg-violet-950/60 border border-violet-800/60 text-violet-200 rounded-lg text-xs font-medium">👥 ${escapeHtml(c.trim())}</span>`).join('')}
                            </div>
                        </div>
                    ` : ''}

                    ${log.reviewText ? `
                        <div>
                            <span class="text-xs font-semibold text-slate-400 block mb-1">탈출 후기</span>
                            <div class="p-3 bg-slate-950 rounded-xl border border-slate-800 text-xs text-slate-200 leading-relaxed whitespace-pre-wrap">
                                ${escapeHtml(log.reviewText)}
                            </div>
                        </div>
                    ` : ''}

                    <div class="pt-3 border-t border-slate-800 flex items-center justify-end gap-2">
                        <button onclick="closeDetailModal(); openModal(true, '${log.id}')" class="px-4 py-2 rounded-xl bg-violet-600 hover:bg-violet-500 text-white font-bold text-xs transition">수정하기</button>
                        <button onclick="closeDetailModal()" class="px-4 py-2 rounded-xl bg-slate-800 text-slate-300 text-xs font-semibold">닫기</button>
                    </div>
                </div>
            `;

            document.getElementById('detailModal').classList.remove('hidden');
        }

        function closeDetailModal() {
            document.getElementById('detailModal').classList.add('hidden');
        }

        function deleteLog(id) {
            const log = logs.find(l => l.id === id);
            if (!log) return;

            // Custom non-alert deletion confirmation dialog
            showConfirmModal(`'${log.themeName}' 기록을 삭제하시겠습니까?`, () => {
                logs = logs.filter(l => l.id !== id);
                saveLogs();
                updateDashboard();
                populateStoreFilter();
                renderLogs();
                showToast('기록이 삭제되었습니다.');
            });
        }

        function exportData() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(logs, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `escape_logbook_backup_${new Date().toISOString().slice(0,10)}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
            showToast('백업 파일이 다운로드 되었습니다!');
        }

        function triggerImport() {
            document.getElementById('importFileInput').click();
        }

        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const imported = JSON.parse(e.target.result);
                    if (Array.isArray(imported)) {
                        logs = imported;
                        saveLogs();
                        updateDashboard();
                        populateStoreFilter();
                        renderLogs();
                        showToast('성공적으로 데이터를 복원했습니다!');
                    } else {
                        showToast('올바르지 않은 백업 파일 형식입니다.');
                    }
                } catch (err) {
                    showToast('파일을 읽는 중 오류가 발생했습니다.');
                }
            };
            reader.readAsText(file);
        }

        function forceAppUpdate() {
            showToast('앱을 최신 상태로 업데이트합니다...');
            setTimeout(() => {
                const url = new URL(window.location.href);
                url.searchParams.set('v', Date.now().toString());
                window.location.href = url.toString();
            }, 500);
        }

        // Custom Toast Message Function
        function showToast(msg) {
            const toast = document.getElementById('messageToast');
            document.getElementById('toastMessage').textContent = msg;
            toast.classList.remove('opacity-0', 'pointer-events-none', 'translate-y-4');
            toast.classList.add('opacity-100', 'translate-y-0');

            setTimeout(() => {
                toast.classList.remove('opacity-100', 'translate-y-0');
                toast.classList.add('opacity-0', 'pointer-events-none', 'translate-y-4');
            }, 2500);
        }

        // Custom Confirmation Modal Helper (Replaces native confirm)
        function showConfirmModal(message, onConfirm) {
            const modalId = 'customConfirmModal';
            let modal = document.getElementById(modalId);
            if (!modal) {
                modal = document.createElement('div');
                modal.id = modalId;
                modal.className = 'fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-md';
                document.body.appendChild(modal);
            }

            modal.innerHTML = `
                <div class="glass-modal max-w-xs w-full p-5 rounded-2xl text-center space-y-4">
                    <i class="fa-solid fa-triangle-exclamation text-amber-400 text-3xl"></i>
                    <p class="text-xs font-bold text-white">${escapeHtml(message)}</p>
                    <div class="flex items-center justify-center gap-2 pt-2">
                        <button id="confirmCancelBtn" class="px-4 py-1.5 rounded-xl bg-slate-800 text-slate-300 text-xs font-semibold">취소</button>
                        <button id="confirmOkBtn" class="px-4 py-1.5 rounded-xl bg-rose-600 text-white text-xs font-bold shadow">삭제</button>
                    </div>
                </div>
            `;

            document.getElementById('confirmCancelBtn').onclick = () => modal.remove();
            document.getElementById('confirmOkBtn').onclick = () => {
                modal.remove();
                onConfirm();
            };
        }

        // Helper: Escape HTML strings to prevent XSS
        function escapeHtml(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }
    </script>
</body>
</html>
