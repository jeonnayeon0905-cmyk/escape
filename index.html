<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>방탈출 로그북</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <!-- Cropper.js (사진 자르기 라이브러리) -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --primary: #8b5cf6;
      --primary-hover: #7c3aed;
      --success: #22c55e;
      --fail: #ef4444;
      --accent: #f59e0b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); padding: 16px; max-width: 800px; margin: 0 auto; padding-bottom: 60px; }
    header { text-align: center; margin-bottom: 16px; }
    header h1 { font-size: 1.6rem; font-weight: 800; background: linear-gradient(135deg, #a855f7, #6366f1); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

    /* 대시보드 */
    .dashboard-compact { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 20px; }
    .dash-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 14px; padding: 14px 10px; text-align: center; }
    .dash-val { font-size: 1.3rem; font-weight: 800; margin-top: 2px; }
    .dash-lbl { font-size: 0.78rem; color: var(--text-sub); }

    /* 컨트롤 바 */
    .control-bar { display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; }
    .action-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
    .btn-primary { background-color: var(--primary); color: white; border: none; padding: 12px 18px; border-radius: 12px; font-weight: 700; font-size: 0.95rem; cursor: pointer; display: flex; align-items: center; gap: 8px; justify-content: center; flex: 1; }
    .sort-select { background-color: var(--card-bg); color: var(--text-main); border: 1px solid var(--card-border); padding: 11px 14px; border-radius: 12px; font-size: 0.88rem; outline: none; }

    /* 일반 카드 목록 */
    .logs-grid { display: flex; flex-direction: column; gap: 14px; }
    .log-card { background-color: var(--card-bg); border: 1px solid var(--card-border); border-radius: 16px; padding: 16px; cursor: pointer; }
    .log-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
    .log-title { font-size: 1.15rem; font-weight: 700; }
    .log-cafe { font-size: 0.82rem; color: var(--text-sub); margin-top: 2px; }
    .badge { padding: 4px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: 700; }
    .badge-success { background-color: rgba(34, 197, 94, 0.15); color: var(--success); }
    .badge-fail { background-color: rgba(239, 68, 68, 0.15); color: var(--fail); }

    .ratings-row { display: flex; gap: 12px; font-size: 0.85rem; color: var(--accent); margin: 6px 0; }
    .genre-badges { display: flex; gap: 4px; flex-wrap: wrap; margin: 8px 0; }
    .genre-tag { font-size: 0.72rem; background: rgba(255, 255, 255, 0.06); padding: 2px 8px; border-radius: 6px; color: var(--text-sub); }

    .log-details { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; font-size: 0.82rem; color: var(--text-sub); background: rgba(0, 0, 0, 0.2); padding: 10px; border-radius: 10px; margin-top: 8px; }
    .thumb-preview { width: 100%; max-height: 200px; object-fit: cover; border-radius: 10px; margin-top: 10px; }
    .card-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 10px; }
    .btn-sm-icon { background: none; border: none; color: var(--text-sub); font-size: 0.82rem; cursor: pointer; padding: 4px 8px; }

    /* 카페별 아코디언 스타일 */
    .cafe-accordion { display: flex; flex-direction: column; gap: 10px; }
    .cafe-group { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 14px; overflow: hidden; }
    .cafe-header { padding: 16px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; background: rgba(255,255,255,0.02); }
    .cafe-name { font-size: 1.05rem; font-weight: 700; }
    .cafe-stats { font-size: 0.8rem; color: var(--text-sub); margin-top: 2px; }
    .cafe-body { display: none; padding: 12px; border-top: 1px solid var(--card-border); background: #0f172a; flex-direction: column; gap: 10px; }
    .cafe-group.open .cafe-body { display: flex; }

    /* 모달 */
    .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.85); display: none; justify-content: center; align-items: center; z-index: 1000; padding: 16px; }
    .modal-content { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 20px; width: 100%; max-width: 520px; max-height: 90vh; overflow-y: auto; padding: 20px; }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    
    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 0.82rem; color: var(--text-sub); margin-bottom: 6px; }
    .form-control { width: 100%; padding: 11px; background: #0f172a; border: 1px solid var(--card-border); border-radius: 10px; color: white; font-size: 0.92rem; outline: none; }
    .form-row { display: flex; gap: 10px; }
    .form-row .form-group { flex: 1; }

    .radio-group { display: flex; gap: 8px; }
    .radio-btn { flex: 1; padding: 10px; text-align: center; background: #0f172a; border: 1px solid var(--card-border); border-radius: 10px; cursor: pointer; font-weight: 700; font-size: 0.88rem; }
    .radio-btn.active-success { background: var(--success); color: white; border-color: var(--success); }
    .radio-btn.active-fail { background: var(--fail); color: white; border-color: var(--fail); }

    .star-rating, .lock-rating { display: flex; gap: 6px; font-size: 1.3rem; color: #475569; cursor: pointer; }
    .star-rating .active { color: var(--accent); }
    .lock-rating .active { color: #38bdf8; }

    .genre-selector { display: flex; flex-wrap: wrap; gap: 6px; }
    .genre-chip { background: #0f172a; border: 1px solid var(--card-border); padding: 6px 12px; border-radius: 8px; font-size: 0.8rem; cursor: pointer; color: var(--text-sub); }
    .genre-chip.selected { background: var(--primary); color: white; border-color: var(--primary); font-weight: 700; }

    .img-upload-box { border: 2px dashed var(--card-border); border-radius: 10px; padding: 16px; text-align: center; cursor: pointer; background: #0f172a; }
    .img-preview-container { position: relative; margin-top: 10px; display: none; }
    .img-preview-container img { width: 100%; max-height: 220px; object-fit: cover; border-radius: 10px; }
    .btn-remove-img { position: absolute; top: 8px; right: 8px; background: rgba(0,0,0,0.7); color: white; border: none; border-radius: 50%; width: 28px; height: 28px; cursor: pointer; }

    /* 자르기(Cropper) 모달 전용 */
    .crop-container { width: 100%; max-height: 350px; background: #000; overflow: hidden; border-radius: 10px; }
    .crop-container img { max-width: 100%; }

    .modal-footer { display: flex; gap: 10px; margin-top: 20px; }
    .btn-secondary { background: #334155; color: white; border: none; padding: 12px; border-radius: 10px; flex: 1; cursor: pointer; font-weight: 600; }
    .detail-img { width: 100%; max-height: 280px; object-fit: cover; border-radius: 12px; margin-bottom: 14px; }
    .detail-memo { background: #0f172a; padding: 14px; border-radius: 10px; font-size: 0.92rem; line-height: 1.5; color: var(--text-main); white-space: pre-wrap; margin-top: 12px; }
  </style>
</head>
<body>

  <header>
    <h1>방탈출 로그북</h1>
  </header>

  <div class="dashboard-compact">
    <div class="dash-card">
      <div class="dash-lbl">누적 기록</div>
      <div class="dash-val" id="totalCount" style="color: var(--primary);">0방</div>
    </div>
    <div class="dash-card">
      <div class="dash-lbl">성공 / 실패</div>
      <div class="dash-val">
        <span id="successCount" style="color: var(--success);">0</span> / <span id="failCount" style="color: var(--fail);">0</span>
      </div>
    </div>
  </div>

  <div class="control-bar">
    <div class="action-row">
      <button class="btn-primary" onclick="openFormModal()">
        <i class="fa-solid fa-plus"></i> 새로운 탈출 기록
      </button>
      <select class="sort-select" id="sortSelect" onchange="renderLogs()">
        <option value="latest">⏱️ 최신순</option>
        <option value="oldest">⏳ 오래된 순</option>
        <option value="cafe">🏢 카페별 모아보기</option>
      </select>
    </div>
  </div>

  <div class="logs-grid" id="logsGrid"></div>

  <!-- 이미지 자르기(Crop) 모달 -->
  <div class="modal-overlay" id="cropModal" style="z-index: 1100;">
    <div class="modal-content">
      <div class="modal-header">
        <h2>사진 자르기</h2>
        <button class="btn-sm-icon" onclick="closeCropModal()"><i class="fa-solid fa-xmark fa-lg"></i></button>
      </div>
      <div class="crop-container">
        <img id="cropImageSrc" src="">
      </div>
      <div class="modal-footer">
        <button type="button" class="btn-secondary" onclick="closeCropModal()">취소</button>
        <button type="button" class="btn-primary" onclick="applyCrop()">자르기 적용</button>
      </div>
    </div>
  </div>

  <!-- 작성 / 수정 모달 -->
  <div class="modal-overlay" id="formModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="formModalTitle">새 기록 작성</h2>
        <button class="btn-sm-icon" onclick="closeFormModal()"><i class="fa-solid fa-xmark fa-lg"></i></button>
      </div>

      <form id="logForm" onsubmit="saveLog(event)">
        <input type="hidden" id="editIndex" value="-1">

        <!-- 사진 첨부 (최상단) -->
        <div class="form-group">
          <label>인증샷 / 보드판 사진</label>
          <div class="img-upload-box" onclick="document.getElementById('imageInput').click()">
            <i class="fa-solid fa-camera fa-lg" style="color: var(--primary);"></i>
            <span style="font-size: 0.85rem; margin-left: 6px; color: var(--text-sub);">사진 선택 및 편집</span>
          </div>
          <input type="file" id="imageInput" accept="image/*" style="display:none" onchange="handleImageSelect(event)">
          
          <div class="img-preview-container" id="imgPreviewContainer">
            <img id="imgPreview" src="" alt="미리보기">
            <button type="button" class="btn-remove-img" onclick="removeImage()"><i class="fa-solid fa-xmark"></i></button>
          </div>
        </div>

        <div class="form-group">
          <label>테마명 *</label>
          <input type="text" id="themeName" class="form-control" placeholder="예: 시네마틱 방탈출" required>
        </div>

        <div class="form-group">
          <label>매장 / 카페명 *</label>
          <input type="text" id="cafeName" class="form-control" placeholder="예: 넥스트에디션 강남점" required>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>플레이 날짜</label>
            <input type="date" id="playDate" class="form-control" required>
          </div>
          <div class="form-group">
            <label>탈출 결과</label>
            <div class="radio-group">
              <div class="radio-btn active-success" id="btnSuccess" onclick="setResult('성공')">성공</div>
              <div class="radio-btn" id="btnFail" onclick="setResult('실패')">실패</div>
            </div>
            <input type="hidden" id="isSuccess" value="성공">
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>만족도 (별점)</label>
            <div class="star-rating" id="starRating">
              <i class="fa-solid fa-star" onclick="setRating('star', 1)"></i>
              <i class="fa-solid fa-star" onclick="setRating('star', 2)"></i>
              <i class="fa-solid fa-star" onclick="setRating('star', 3)"></i>
              <i class="fa-solid fa-star" onclick="setRating('star', 4)"></i>
              <i class="fa-solid fa-star" onclick="setRating('star', 5)"></i>
            </div>
          </div>
          <div class="form-group">
            <label>난이도 (자물쇠)</label>
            <div class="lock-rating" id="lockRating">
              <i class="fa-solid fa-lock" onclick="setRating('lock', 1)"></i>
              <i class="fa-solid fa-lock" onclick="setRating('lock', 2)"></i>
              <i class="fa-solid fa-lock" onclick="setRating('lock', 3)"></i>
              <i class="fa-solid fa-lock" onclick="setRating('lock', 4)"></i>
              <i class="fa-solid fa-lock" onclick="setRating('lock', 5)"></i>
            </div>
          </div>
        </div>

        <div class="form-group">
          <label>장르 선택 (다중 선택 가능)</label>
          <div class="genre-selector" id="modalGenreChips">
            <div class="genre-chip" onclick="toggleFormGenre('공포/스릴러', this)">공포/스릴러</div>
            <div class="genre-chip" onclick="toggleFormGenre('추리/미스터리', this)">추리/미스터리</div>
            <div class="genre-chip" onclick="toggleFormGenre('감성/드라마', this)">감성/드라마</div>
            <div class="genre-chip" onclick="toggleFormGenre('SF/판타지', this)">SF/판타지</div>
            <div class="genre-chip" onclick="toggleFormGenre('모험/코믹', this)">모험/코믹</div>
            <div class="genre-chip" onclick="toggleFormGenre('잠입/액션', this)">잠입/액션</div>
            <div class="genre-chip" onclick="toggleFormGenre('???', this)">???</div>
            <div class="genre-chip" id="etcChip" onclick="toggleFormGenre('기타', this)">기타</div>
          </div>
          <input type="text" id="etcGenreInput" class="form-control" style="display:none; margin-top:8px;" placeholder="기타 장르를 직접 입력하세요">
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>남은 시간</label>
            <input type="text" id="timeLeft" class="form-control" placeholder="예: 05:30">
          </div>
          <div class="form-group">
            <label>사용 힌트 수</label>
            <input type="text" id="hintCount" class="form-control" placeholder="예: 1개 / 노힌트">
          </div>
        </div>

        <div class="form-group">
          <label>동행인</label>
          <input type="text" id="partyMembers" class="form-control" placeholder="함께한 사람들">
        </div>

        <div class="form-group">
          <label>탈출 후기 / 메모</label>
          <textarea id="memo" class="form-control" rows="3" placeholder="후기를 자유롭게 적어보세요."></textarea>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn-secondary" onclick="closeFormModal()">취소</button>
          <button type="submit" class="btn-primary">저장하기</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 상세보기 모달 -->
  <div class="modal-overlay" id="detailModal">
    <div class="modal-content">
      <div class="modal-header">
        <span class="badge" id="detailBadge">성공</span>
        <button class="btn-sm-icon" onclick="closeDetailModal()"><i class="fa-solid fa-xmark fa-lg"></i></button>
      </div>

      <div id="detailImageArea"></div>

      <h2 id="detailTitle" style="font-size: 1.3rem; margin-bottom: 4px;"></h2>
      <div id="detailCafe" style="color: var(--text-sub); font-size: 0.88rem; margin-bottom: 8px;"></div>

      <div class="ratings-row" id="detailRatings"></div>
      <div id="detailGenres" class="genre-badges" style="margin-bottom: 12px;"></div>

      <div class="log-details">
        <div>플레이 날짜: <span id="detailDate"></span></div>
        <div>남은 시간: <span id="detailTime"></span></div>
        <div>사용 힌트: <span id="detailHint"></span></div>
        <div>동행인: <span id="detailParty"></span></div>
      </div>

      <div class="detail-memo" id="detailMemo"></div>

      <div class="modal-footer">
        <button class="btn-secondary" onclick="closeDetailModal()">닫기</button>
        <button class="btn-primary" id="detailEditBtn"><i class="fa-solid fa-pen-to-square"></i> 수정하기</button>
      </div>
    </div>
  </div>

  <script>
    function getStoredLogs() {
      try {
        const stored = localStorage.getItem('escapeLogs');
        return stored ? JSON.parse(stored) : [];
      } catch (e) {
        return [];
      }
    }

    let logs = getStoredLogs();
    let selectedFormGenres = [];
    let currentBase64Image = '';
    let currentStarRating = 0;
    let currentLockRating = 0;
    let cropper = null;

    function saveLogsToStorage() {
      try {
        localStorage.setItem('escapeLogs', JSON.stringify(logs));
      } catch (e) {
        alert("저장 용량이 부족합니다. 이미지 크기를 줄이거나 기존 기록을 확인해보세요.");
      }
    }

    function updateStats() {
      const total = logs.length;
      const success = logs.filter(l => l.isSuccess === '성공').length;
      const fail = total - success;

      document.getElementById('totalCount').innerText = total + '방';
      document.getElementById('successCount').innerText = success;
      document.getElementById('failCount').innerText = fail;
    }

    function renderLogs() {
      updateStats();
      const grid = document.getElementById('logsGrid');
      const sortType = document.getElementById('sortSelect').value;

      if (logs.length === 0) {
        grid.innerHTML = '<div style="text-align:center; color: var(--text-sub); padding: 50px 0;">등록된 기록이 없습니다.<br>버튼을 눌러 새로운 탈출 기록을 입력해보세요!</div>';
        return;
      }

      // 🏢 카페별 모아보기 처리
      if (sortType === 'cafe') {
        const cafeMap = {};
        logs.forEach((log, index) => {
          const cafe = log.cafeName.trim() || '기타 매장';
          if (!cafeMap[cafe]) cafeMap[cafe] = [];
          cafeMap[cafe].push({ ...log, originalIndex: index });
        });

        let cafeHtml = '<div class="cafe-accordion">';
        for (const cafe in cafeMap) {
          const cafeLogs = cafeMap[cafe];
          const succCount = cafeLogs.filter(l => l.isSuccess === '성공').length;
          
          cafeHtml += `
            <div class="cafe-group">
              <div class="cafe-header" onclick="this.parentElement.classList.toggle('open')">
                <div>
                  <div class="cafe-name">🏢 ${escapeHtml(cafe)}</div>
                  <div class="cafe-stats">방문 횟수: ${cafeLogs.length}회 | 성공: ${succCount}회</div>
                </div>
                <i class="fa-solid fa-chevron-down" style="color: var(--text-sub);"></i>
              </div>
              <div class="cafe-body">
                ${cafeLogs.map(log => renderSingleCardHtml(log)).join('')}
              </div>
            </div>
          `;
        }
        cafeHtml += '</div>';
        grid.innerHTML = cafeHtml;
        return;
      }

      // 일반 정렬 (최신순 / 오래된순)
      let filtered = logs.map((log, index) => ({ ...log, originalIndex: index }));
      filtered.sort((a, b) => {
        const dateA = new Date(a.playDate || 0);
        const dateB = new Date(b.playDate || 0);
        return sortType === 'latest' ? dateB - dateA : dateA - dateB;
      });

      grid.innerHTML = filtered.map(log => renderSingleCardHtml(log)).join('');
    }

    function renderSingleCardHtml(log) {
      const isSucc = log.isSuccess === '성공';
      const genreTags = (log.genres || []).map(g => `<span class="genre-tag">${escapeHtml(g)}</span>`).join('');
      
      let starsHtml = log.starRating ? `<span style="color:var(--accent);">★ ${log.starRating}</span>` : '';
      let locksHtml = log.lockRating ? `<span style="color:#38bdf8;">🔒 ${log.lockRating}</span>` : '';

      return `
        <div class="log-card" onclick="openDetailModal(${log.originalIndex})">
          <div class="log-top">
            <div>
              <div class="log-title">${escapeHtml(log.themeName)}</div>
              <div class="log-cafe">${escapeHtml(log.cafeName)}</div>
            </div>
            <span class="badge ${isSucc ? 'badge-success' : 'badge-fail'}">
              ${isSucc ? '성공' : '실패'}
            </span>
          </div>

          ${(starsHtml || locksHtml) ? `<div class="ratings-row">${starsHtml} ${locksHtml}</div>` : ''}
          ${genreTags ? `<div class="genre-badges">${genreTags}</div>` : ''}

          <div class="log-details">
            <div>날짜: <span>${log.playDate || '-'}</span></div>
            <div>남은 시간: <span>${escapeHtml(log.timeLeft) || '-'}</span></div>
          </div>

          ${log.image ? `<img src="${log.image}" class="thumb-preview" alt="인증샷">` : ''}

          <div class="card-actions" onclick="event.stopPropagation()">
            <button class="btn-sm-icon" onclick="editLog(${log.originalIndex})"><i class="fa-solid fa-pen-to-square"></i> 수정</button>
            <button class="btn-sm-icon" onclick="deleteLog(${log.originalIndex})" style="color: var(--fail);"><i class="fa-solid fa-trash"></i> 삭제</button>
          </div>
        </div>
      `;
    }

    /* 이미지 크롭(Cropper) 관련 기능 */
    function handleImageSelect(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(evt) {
        document.getElementById('cropImageSrc').src = evt.target.result;
        document.getElementById('cropModal').style.display = 'flex';

        if (cropper) cropper.destroy();
        const image = document.getElementById('cropImageSrc');
        cropper = new Cropper(image, {
          aspectRatio: 16 / 9, // 카드 형태 규격
          viewMode: 1
        });
      };
      reader.readAsDataURL(file);
    }

    function applyCrop() {
      if (!cropper) return;
      const canvas = cropper.getCroppedCanvas({
        width: 800,
        height: 450
      });
      currentBase64Image = canvas.toDataURL('image/jpeg', 0.7);
      document.getElementById('imgPreview').src = currentBase64Image;
      document.getElementById('imgPreviewContainer').style.display = 'block';
      closeCropModal();
    }

    function closeCropModal() {
      document.getElementById('cropModal').style.display = 'none';
      if (cropper) cropper.destroy();
    }

    function removeImage() {
      currentBase64Image = '';
      document.getElementById('imageInput').value = '';
      document.getElementById('imgPreview').src = '';
      document.getElementById('imgPreviewContainer').style.display = 'none';
    }

    /* 상세보기 모달 */
    function openDetailModal(index) {
      const log = logs[index];
      const isSucc = log.isSuccess === '성공';

      const badgeEl = document.getElementById('detailBadge');
      badgeEl.className = `badge ${isSucc ? 'badge-success' : 'badge-fail'}`;
      badgeEl.innerText = isSucc ? '성공' : '실패';

      document.getElementById('detailTitle').innerText = log.themeName;
      document.getElementById('detailCafe').innerText = log.cafeName;
      document.getElementById('detailDate').innerText = log.playDate || '-';
      document.getElementById('detailTime').innerText = log.timeLeft || '-';
      document.getElementById('detailHint').innerText = log.hintCount || '-';
      document.getElementById('detailParty').innerText = log.partyMembers || '-';

      const imgArea = document.getElementById('detailImageArea');
      imgArea.innerHTML = log.image ? `<img src="${log.image}" class="detail-img" alt="인증샷">` : '';

      const ratingsArea = document.getElementById('detailRatings');
      let rHtml = '';
      if (log.starRating) rHtml += `<span>★ 만족도: ${log.starRating}점</span> `;
      if (log.lockRating) rHtml += `<span style="color:#38bdf8; margin-left:8px;">🔒 난이도: ${log.lockRating}단계</span>`;
      ratingsArea.innerHTML = rHtml;

      const genresArea = document.getElementById('detailGenres');
      genresArea.innerHTML = (log.genres || []).map(g => `<span class="genre-tag">${escapeHtml(g)}</span>`).join('');

      const memoEl = document.getElementById('detailMemo');
      if (log.memo && log.memo.trim() !== '') {
        memoEl.style.display = 'block';
        memoEl.innerText = log.memo;
      } else {
        memoEl.style.display = 'none';
        memoEl.innerText = '';
      }

      document.getElementById('detailEditBtn').onclick = function() {
        closeDetailModal();
        editLog(index);
      };

      document.getElementById('detailModal').style.display = 'flex';
    }

    function closeDetailModal() {
      document.getElementById('detailModal').style.display = 'none';
    }

    function openFormModal() {
      document.getElementById('editIndex').value = '-1';
      document.getElementById('logForm').reset();
      document.getElementById('playDate').valueAsDate = new Date();
      selectedFormGenres = [];
      document.querySelectorAll('#modalGenreChips .genre-chip').forEach(c => c.classList.remove('selected'));
      document.getElementById('etcGenreInput').style.display = 'none';
      setRating('star', 0);
      setRating('lock', 0);
      removeImage();
      setResult('성공');
      document.getElementById('formModalTitle').innerText = '새 기록 작성';
      document.getElementById('formModal').style.display = 'flex';
    }

    function closeFormModal() {
      document.getElementById('formModal').style.display = 'none';
    }

    function setRating(type, val) {
      if (type === 'star') {
        currentStarRating = val;
        document.querySelectorAll('#starRating i').forEach((s, idx) => s.classList.toggle('active', idx < val));
      } else {
        currentLockRating = val;
        document.querySelectorAll('#lockRating i').forEach((l, idx) => l.classList.toggle('active', idx < val));
      }
    }

    function toggleFormGenre(genre, el) {
      if (genre === '기타') {
        const input = document.getElementById('etcGenreInput');
        if (el.classList.contains('selected')) {
          el.classList.remove('selected');
          input.style.display = 'none';
        } else {
          el.classList.add('selected');
          input.style.display = 'block';
        }
        return;
      }

      if (selectedFormGenres.includes(genre)) {
        selectedFormGenres = selectedFormGenres.filter(g => g !== genre);
        el.classList.remove('selected');
      } else {
        selectedFormGenres.push(genre);
        el.classList.add('selected');
      }
    }

    function setResult(val) {
      document.getElementById('isSuccess').value = val;
      const btnS = document.getElementById('btnSuccess');
      const btnF = document.getElementById('btnFail');

      if (val === '성공') {
        btnS.className = 'radio-btn active-success';
        btnF.className = 'radio-btn';
      } else {
        btnS.className = 'radio-btn';
        btnF.className = 'radio-btn active-fail';
      }
    }

    function saveLog(e) {
      e.preventDefault();
      const index = parseInt(document.getElementById('editIndex').value);

      let finalGenres = [...selectedFormGenres];
      const etcChip = document.getElementById('etcChip');
      if (etcChip.classList.contains('selected')) {
        const etcVal = document.getElementById('etcGenreInput').value.trim();
        if (etcVal) finalGenres.push(etcVal);
      }

      const logData = {
        themeName: document.getElementById('themeName').value,
        cafeName: document.getElementById('cafeName').value,
        playDate: document.getElementById('playDate').value,
        isSuccess: document.getElementById('isSuccess').value,
        starRating: currentStarRating,
        lockRating: currentLockRating,
        genres: finalGenres,
        timeLeft: document.getElementById('timeLeft').value,
        hintCount: document.getElementById('hintCount').value,
        partyMembers: document.getElementById('partyMembers').value,
        image: currentBase64Image,
        memo: document.getElementById('memo').value
      };

      if (index === -1) {
        logs.push(logData);
      } else {
        logs[index] = logData;
      }

      saveLogsToStorage();
      closeFormModal();
      renderLogs();
    }

    function editLog(index) {
      const log = logs[index];
      document.getElementById('editIndex').value = index;
      document.getElementById('themeName').value = log.themeName;
      document.getElementById('cafeName').value = log.cafeName;
      document.getElementById('playDate').value = log.playDate;
      document.getElementById('timeLeft').value = log.timeLeft || '';
      document.getElementById('hintCount').value = log.hintCount || '';
      document.getElementById('partyMembers').value = log.partyMembers || '';
      document.getElementById('memo').value = log.memo || '';
      setResult(log.isSuccess);
      setRating('star', log.starRating || 0);
      setRating('lock', log.lockRating || 0);

      selectedFormGenres = [];
      const etcInput = document.getElementById('etcGenreInput');
      const etcChip = document.getElementById('etcChip');
      etcInput.style.display = 'none';
      etcChip.classList.remove('selected');

      const defaultGenres = ['공포/스릴러', '추리/미스터리', '감성/드라마', 'SF/판타지', '모험/코믹', '잠입/액션', '???'];

      (log.genres || []).forEach(g => {
        if (defaultGenres.includes(g)) {
          selectedFormGenres.push(g);
        } else {
          etcChip.classList.add('selected');
          etcInput.style.display = 'block';
          etcInput.value = g;
        }
      });

      document.querySelectorAll('#modalGenreChips .genre-chip').forEach(chip => {
        if (selectedFormGenres.includes(chip.innerText)) {
          chip.classList.add('selected');
        } else if (chip.innerText !== '기타') {
          chip.classList.remove('selected');
        }
      });

      if (log.image) {
        currentBase64Image = log.image;
        document.getElementById('imgPreview').src = log.image;
        document.getElementById('imgPreviewContainer').style.display = 'block';
      } else {
        removeImage();
      }

      document.getElementById('formModalTitle').innerText = '기록 수정';
      document.getElementById('formModal').style.display = 'flex';
    }

    function deleteLog(index) {
      if (confirm('이 방탈출 기록을 삭제하시겠습니까?')) {
        logs.splice(index, 1);
        saveLogsToStorage();
        renderLogs();
      }
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    renderLogs();
  </script>
</body>
</html>
