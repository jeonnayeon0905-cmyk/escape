<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>방탈출 로그북</title>

  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="./icon.png">
  <meta name="theme-color" content="#0f172a">

  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
  
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --primary: #8b5cf6;
      --primary-hover: #7c3aed;
      --success: #22c55e;
      --fail: #ef4444;
      --accent: #f59e0b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); padding: 16px; max-width: 800px; margin: 0 auto; padding-bottom: 60px; }
    
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; border-bottom: 1px solid var(--card-border); padding-bottom: 12px; }
    header h1 { font-size: 1.5rem; font-weight: 800; background: linear-gradient(135deg, #a855f7, #6366f1); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    
    .user-profile { display: flex; align-items: center; gap: 8px; }
    .user-profile img { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; }
    .btn-auth { background: rgba(255, 255, 255, 0.08); border: 1px solid var(--card-border); color: var(--text-main); padding: 6px 12px; border-radius: 8px; font-size: 0.8rem; cursor: pointer; display: flex; align-items: center; gap: 6px; }

    /* 대시보드 */
    .dashboard-compact { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 16px; }
    .dash-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 14px; padding: 14px 10px; text-align: center; }
    .dash-val { font-size: 1.3rem; font-weight: 800; margin-top: 2px; }
    .dash-lbl { font-size: 0.78rem; color: var(--text-sub); }

    .control-bar { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
    .action-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
    .backup-row { display: flex; gap: 8px; }
    
    .btn-primary { background-color: var(--primary); color: white; border: none; padding: 12px 18px; border-radius: 12px; font-weight: 700; font-size: 0.95rem; cursor: pointer; display: flex; align-items: center; gap: 8px; justify-content: center; flex: 1; }
    .btn-backup { background-color: var(--card-bg); color: var(--text-main); border: 1px solid var(--card-border); padding: 8px 12px; border-radius: 10px; font-size: 0.8rem; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 6px; flex: 1; justify-content: center; }
    .sort-select { background-color: var(--card-bg); color: var(--text-main); border: 1px solid var(--card-border); padding: 11px 14px; border-radius: 12px; font-size: 0.88rem; outline: none; }

    /* 카드 */
    .logs-grid { display: flex; flex-direction: column; gap: 14px; }
    .log-card { background-color: var(--card-bg); border: 1px solid var(--card-border); border-radius: 16px; padding: 16px; cursor: pointer; }
    .log-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
    .log-title { font-size: 1.15rem; font-weight: 700; }
    .log-cafe { font-size: 0.82rem; color: var(--text-sub); margin-top: 2px; }
    .badge { padding: 4px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: 700; }
    .badge-success { background-color: rgba(34, 197, 94, 0.15); color: var(--success); }
    .badge-fail { background-color: rgba(239, 68, 68, 0.15); color: var(--fail); }

    .ratings-row { display: flex; gap: 12px; font-size: 0.85rem; color: var(--accent); margin: 6px 0; }
    .genre-badges { display: flex; gap: 4px; flex-wrap: wrap; margin: 8px 0; }
    .genre-tag { font-size: 0.72rem; background: rgba(255, 255, 255, 0.06); padding: 2px 8px; border-radius: 6px; color: var(--text-sub); }

    .log-details { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; font-size: 0.82rem; color: var(--text-sub); background: rgba(0, 0, 0, 0.2); padding: 10px; border-radius: 10px; margin-top: 8px; }
    .thumb-preview { width: 100%; max-height: 200px; object-fit: cover; border-radius: 10px; margin-top: 10px; }
    .card-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 10px; }
    .btn-sm-icon { background: none; border: none; color: var(--text-sub); font-size: 0.82rem; cursor: pointer; padding: 4px 8px; }

    /* 아코디언 */
    .cafe-accordion { display: flex; flex-direction: column; gap: 10px; }
    .cafe-group { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 14px; overflow: hidden; }
    .cafe-header { padding: 16px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; background: rgba(255,255,255,0.02); }
    .cafe-name { font-size: 1.05rem; font-weight: 700; }
    .cafe-stats { font-size: 0.8rem; color: var(--text-sub); margin-top: 2px; }
    .cafe-body { display: none; padding: 12px; border-top: 1px solid var(--card-border); background: #0f172a; flex-direction: column; gap: 10px; }
    .cafe-group.open .cafe-body { display: flex; }

    /* 모달 */
    .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.85); display: none; justify-content: center; align-items: center; z-index: 1000; padding: 16px; }
    .modal-content { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 20px; width: 100%; max-width: 520px; max-height: 90vh; overflow-y: auto; padding: 20px; }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    
    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 0.82rem; color: var(--text-sub); margin-bottom: 6px; }
    .form-control { width: 100%; padding: 11px; background: #0f172a; border: 1px solid var(--card-border); border-radius: 10px; color: white; font-size: 0.92rem; outline: none; }
    .form-row { display: flex; gap: 10px; }
    .form-row .form-group { flex: 1; }

    .radio-group { display: flex; gap: 8px; }
    .radio-btn { flex: 1; padding: 10px; text-align: center; background: #0f172a; border: 1px solid var(--card-border); border-radius: 10px; cursor: pointer; font-weight: 700; font-size: 0.88rem; }
    .radio-btn.active-success { background: var(--success); color: white; border-color: var(--success); }
    .radio-btn.active-fail { background: var(--fail); color: white; border-color: var(--fail); }

    .star-rating, .lock-rating { display: flex; gap: 6px; font-size: 1.3rem; color: #475569; cursor: pointer; }
    .star-rating .active { color: var(--accent); }
    .lock-rating .active { color: #38bdf8; }

    .genre-selector { display: flex; flex-wrap: wrap; gap: 6px; }
    .genre-chip { background: #0f172a; border: 1px solid var(--card-border); padding: 6px 12px; border-radius: 8px; font-size: 0.8rem; cursor: pointer; color: var(--text-sub); }
    .genre-chip.selected { background: var(--primary); color: white; border-color: var(--primary); font-weight: 700; }

    .img-upload-box { border: 2px dashed var(--card-border); border-radius: 10px; padding: 16px; text-align: center; cursor: pointer; background: #0f172a; }
    .img-preview-container { position: relative; margin-top: 10px; display: none; }
    .img-preview-container img { width: 100%; max-height: 220px; object-fit: cover; border-radius: 10px; }
    .btn-remove-img { position: absolute; top: 8px; right: 8px; background: rgba(0,0,0,0.7); color: white; border: none; border-radius: 50%; width: 28px; height: 28px; cursor: pointer; }

    .crop-container { width: 100%; max-height: 350px; background: #000; overflow: hidden; border-radius: 10px; }
    .crop-container img { max-width: 100%; }

    .modal-footer { display: flex; gap: 10px; margin-top: 20px; }
    .btn-secondary { background: #334155; color: white; border: none; padding: 12px; border-radius: 10px; flex: 1; cursor: pointer; font-weight: 600; }
    .detail-img { width: 100%; max-height: 280px; object-fit: cover; border-radius: 12px; margin-bottom: 14px; }
    .detail-memo { background: #0f172a; padding: 14px; border-radius: 10px; font-size: 0.92rem; line-height: 1.5; color: var(--text-main); white-space: pre-wrap; margin-top: 12px; }

    /* 로그인 안내 전용 카드 */
    .login-banner { background: var(--card-bg); border: 1px dashed var(--primary); border-radius: 16px; padding: 24px; text-align: center; margin-bottom: 20px; }
    .login-banner h3 { font-size: 1.1rem; margin-bottom: 6px; }
    .login-banner p { font-size: 0.85rem; color: var(--text-sub); margin-bottom: 16px; }
    
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <header>
    <h1>방탈출 로그북</h1>
    <div class="user-profile">
      <div id="userInfo" class="user-profile hidden">
        <img id="userImg" src="" alt="프로필">
        <span id="userName" style="font-size: 0.82rem; font-weight: 600;"></span>
        <button class="btn-auth" onclick="handleSignOut()"><i class="fa-solid fa-right-from-bracket"></i></button>
      </div>
      <button id="btnLogin" class="btn-auth" onclick="handleSignIn()"><i class="fa-brands fa-google"></i> 구글 로그인</button>
    </div>
  </header>

  <div id="loginNotice" class="login-banner">
    <h3>구글 로그인이 필요합니다</h3>
    <p>로그인 시 앱 삭제나 스마트폰 변경에도 내 기록이 구글 클라우드에 영구적으로 안전하게 보관됩니다.</p>
    <button class="btn-primary" style="margin: 0 auto; max-width: 220px;" onclick="handleSignIn()">
      <i class="fa-brands fa-google"></i> Google 계정으로 로그인
    </button>
  </div>

  <div id="mainAppArea" class="hidden">
    <div class="dashboard-compact">
      <div class="dash-card">
        <div class="dash-lbl">누적 기록</div>
        <div class="dash-val" id="totalCount" style="color: var(--primary);">0방</div>
      </div>
      <div class="dash-card">
        <div class="dash-lbl">성공 / 실패</div>
        <div class="dash-val">
          <span id="successCount" style="color: var(--success);">0</span> / <span id="failCount" style="color: var(--fail);">0</span>
        </div>
      </div>
    </div>

    <div class="control-bar">
      <div class="action-row">
        <button class="btn-primary" onclick="openFormModal()">
          <i class="fa-solid fa-plus"></i> 새로운 탈출 기록
        </button>
        <select class="sort-select" id="sortSelect" onchange="renderLogs()">
          <option value="latest">⏱️ 최신순</option>
          <option value="oldest">⏳ 오래된 순</option>
          <option value="cafe">🏢 카페별 모아보기</option>
        </select>
      </div>

      <div class="backup-row">
        <button class="btn-backup" onclick="exportData()">
          <i class="fa-solid fa-download"></i> 백업 파일 받기
        </button>
        <button class="btn-backup" onclick="document.getElementById('importFileInput').click()">
          <i class="fa-solid fa-upload"></i> 파일 복구하기
        </button>
        <input type="file" id="importFileInput" accept=".json" style="display:none" onchange="importData(event)">
      </div>
    </div>

    <div class="logs-grid" id="logsGrid"></div>
  </div>

  <div class="modal-overlay" id="cropModal" style="z-index: 1100;">
    <div class="modal-content">
      <div class="modal-header">
        <h2>사진 자르기</h2>
        <button class="btn-sm-icon" onclick="closeCropModal()"><i class="fa-solid fa-xmark fa-lg"></i></button>
      </div>
      <div class="crop-container">
        <img id="cropImageSrc" src="">
      </div>
      <div class="modal-footer">
        <button type="button" class="btn-secondary" onclick="closeCropModal()">취소</button>
        <button type="button" class="btn-primary" onclick="applyCrop()">자르기 적용</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="formModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="formModalTitle">새 기록 작성</h2>
        <button class="btn-sm-icon" onclick="closeFormModal()"><i class="fa-solid fa-xmark fa-lg"></i></button>
      </div>

      <form id="logForm" onsubmit="saveLog(event)">
        <input type="hidden" id="editDocId" value="">

        <div class="form-group">
          <label>인증샷 / 보드판 사진</label>
          <div class="img-upload-box" onclick="document.getElementById('imageInput').click()">
            <i class="fa-solid fa-camera fa-lg" style="color: var(--primary);"></i>
            <span style="font-size: 0.85rem; margin-left: 6px; color: var(--text-sub);">사진 선택 및 편집</span>
          </div>
          <input type="file" id="imageInput" accept="image/*" style="display:none" onchange="handleImageSelect(event)">
          
          <div class="img-preview-container" id="imgPreviewContainer">
            <img id="imgPreview" src="" alt="미리보기">
            <button type="button" class="btn-remove-img" onclick="removeImage()"><i class="fa-solid fa-xmark"></i></button>
          </div>
        </div>

        <div class="form-group">
          <label>테마명 *</label>
          <input type="text" id="themeName" class="form-control" placeholder="예: 시네마틱 방탈출" required>
        </div>

        <div class="form-group">
          <label>매장 / 카페명 *</label>
          <input type="text" id="cafeName" class="form-control" placeholder="예: 넥스트에디션 강남점" required>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>플레이 날짜</label>
            <input type="date" id="playDate" class="form-control" required>
          </div>
          <div class="form-group">
            <label>탈출 결과</label>
            <div class="radio-group">
              <div class="radio-btn active-success" id="btnSuccess" onclick="setResult('성공')">성공</div>
              <div class="radio-btn" id="btnFail" onclick="setResult('실패')">실패</div>
            </div>
            <input type="hidden" id="isSuccess" value="성공">
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>만족도 (별점)</label>
            <div class="star-rating" id="starRating">
              <i class="fa-solid fa-star" onclick="setRating('star', 1)"></i>
              <i class="fa-solid fa-star" onclick="setRating('star', 2)"></i>
              <i class="fa-solid fa-star" onclick="setRating('star', 3)"></i>
              <i class="fa-solid fa-star" onclick="setRating('star', 4)"></i>
              <i class="fa-solid fa-star" onclick="setRating('star', 5)"></i>
            </div>
          </div>
          <div class="form-group">
            <label>난이도 (자물쇠)</label>
            <div class="lock-rating" id="lockRating">
              <i class="fa-solid fa-lock" onclick="setRating('lock', 1)"></i>
              <i class="fa-solid fa-lock" onclick="setRating('lock', 2)"></i>
              <i class="fa-solid fa-lock" onclick="setRating('lock', 3)"></i>
              <i class="fa-solid fa-lock" onclick="setRating('lock', 4)"></i>
              <i class="fa-solid fa-lock" onclick="setRating('lock', 5)"></i>
            </div>
          </div>
        </div>

        <div class="form-group">
          <label>장르 선택 (다중 선택 가능)</label>
          <div class="genre-selector" id="modalGenreChips">
            <div class="genre-chip" onclick="toggleFormGenre('공포/스릴러', this)">공포/스릴러</div>
            <div class="genre-chip" onclick="toggleFormGenre('추리/미스터리', this)">추리/미스터리</div>
            <div class="genre-chip" onclick="toggleFormGenre('감성/드라마', this)">감성/드라마</div>
            <div class="genre-chip" onclick="toggleFormGenre('SF/판타지', this)">SF/판타지</div>
            <div class="genre-chip" onclick="toggleFormGenre('모험/코믹', this)">모험/코믹</div>
            <div class="genre-chip" onclick="toggleFormGenre('잠입/액션', this)">잠입/액션</div>
            <div class="genre-chip" onclick="toggleFormGenre('???', this)">???</div>
            <div class="genre-chip" id="etcChip" onclick="toggleFormGenre('기타', this)">기타</div>
          </div>
          <input type="text" id="etcGenreInput" class="form-control" style="display:none; margin-top:8px;" placeholder="기타 장르를 직접 입력하세요">
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>남은 시간</label>
            <input type="text" id="timeLeft" class="form-control" placeholder="예: 05:30">
          </div>
          <div class="form-group">
            <label>사용 힌트 수</label>
            <input type="text" id="hintCount" class="form-control" placeholder="예: 1개 / 노힌트">
          </div>
        </div>

        <div class="form-group">
          <label>동행인</label>
          <input type="text" id="partyMembers" class="form-control" placeholder="함께한 사람들">
        </div>

        <div class="form-group">
          <label>탈출 후기 / 메모</label>
          <textarea id="memo" class="form-control" rows="3" placeholder="후기를 자유롭게 적어보세요."></textarea>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn-secondary" onclick="closeFormModal()">취소</button>
          <button type="submit" class="btn-primary">클라우드에 저장</button>
        </div>
      </form>
    </div>
  </div>

  <div class="modal-overlay" id="detailModal">
    <div class="modal-content">
      <div class="modal-header">
        <span class="badge" id="detailBadge">성공</span>
        <button class="btn-sm-icon" onclick="closeDetailModal()"><i class="fa-solid fa-xmark fa-lg"></i></button>
      </div>

      <div id="detailImageArea"></div>

      <h2 id="detailTitle" style="font-size: 1.3rem; margin-bottom: 4px;"></h2>
      <div id="detailCafe" style="color: var(--text-sub); font-size: 0.88rem; margin-bottom: 8px;"></div>

      <div class="ratings-row" id="detailRatings"></div>
      <div id="detailGenres" class="genre-badges" style="margin-bottom: 12px;"></div>

      <div class="log-details">
        <div>플레이 날짜: <span id="detailDate"></span></div>
        <div>남은 시간: <span id="detailTime"></span></div>
        <div>사용 힌트: <span id="detailHint"></span></div>
        <div>동행인: <span id="detailParty"></span></div>
      </div>

      <div class="detail-memo" id="detailMemo"></div>

      <div class="modal-footer">
        <button class="btn-secondary" onclick="closeDetailModal()">닫기</button>
        <button class="btn-primary" id="detailEditBtn"><i class="fa-solid fa-pen-to-square"></i> 수정하기</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { 
      getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, onSnapshot, query, orderBy, writeBatch 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // 🔴 본인의 Firebase 콘솔 설정값을 입력하세요!
    const firebaseConfig = {
    apiKey: "AIzaSyCQU0EEsfxFUz7HkZiHkO5Dbhr1IXsrOn4",
    authDomain: "roomescape-log.firebaseapp.com",
    projectId: "roomescape-log",
    storageBucket: "roomescape-log.firebasestorage.app",
    messagingSenderId: "457770219847",
    appId: "1:457770219847:web:7f0454cd0e232eb6c3b462"
  };
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    let currentUser = null;
    let logs = [];
    let unsubscribe = null;

    window.handleSignIn = async function() {
      try {
        await signInWithPopup(auth, provider);
      } catch (err) {
        alert("로그인 중 오류가 발생했습니다: " + err.message);
      }
    };

    window.handleSignOut = function() {
      if (confirm("로그아웃 하시겠습니까?")) {
        signOut(auth);
      }
    };

    onAuthStateChanged(auth, (user) => {
      currentUser = user;
      const loginBanner = document.getElementById('loginNotice');
      const mainArea = document.getElementById('mainAppArea');
      const btnLogin = document.getElementById('btnLogin');
      const userInfo = document.getElementById('userInfo');

      if (user) {
        loginBanner.classList.add('hidden');
        mainArea.classList.remove('hidden');
        btnLogin.classList.add('hidden');
        userInfo.classList.remove('hidden');

        document.getElementById('userName').innerText = user.displayName || '사용자';
        document.getElementById('userImg').src = user.photoURL || 'https://via.placeholder.com/32';

        listenToLogs(user.uid);
      } else {
        loginBanner.classList.remove('hidden');
        mainArea.classList.add('hidden');
        btnLogin.classList.remove('hidden');
        userInfo.classList.add('hidden');

        logs = [];
        if (unsubscribe) unsubscribe();
        renderLogs();
      }
    });

    function listenToLogs(userId) {
      const q = query(
        collection(db, 'users', userId, 'records'),
        orderBy('playDate', 'desc')
      );

      unsubscribe = onSnapshot(q, (snapshot) => {
        logs = snapshot.docs.map(docSnap => ({
          docId: docSnap.id,
          ...docSnap.data()
        }));
        renderLogs();
      });
    }

    window.saveLogToFirestore = async function(logData, docId) {
      if (!currentUser) return;
      try {
        if (docId) {
          await updateDoc(doc(db, 'users', currentUser.uid, 'records', docId), logData);
        } else {
          await addDoc(collection(db, 'users', currentUser.uid, 'records'), logData);
        }
        closeFormModal();
      } catch (e) {
        alert("구글 서버 저장 실패: " + e.message);
      }
    };

    window.deleteLogFromFirestore = async function(docId) {
      if (!currentUser) return;
      if (confirm('이 기록을 삭제하시겠습니까?')) {
        try {
          await deleteDoc(doc(db, 'users', currentUser.uid, 'records', docId));
        } catch (e) {
          alert("삭제 실패: " + e.message);
        }
      }
    };

    window.importBatchData = async function(importedArray) {
      if (!currentUser) return;
      try {
        const batch = writeBatch(db);
        importedArray.forEach(item => {
          const newRef = doc(collection(db, 'users', currentUser.uid, 'records'));
          batch.set(newRef, item);
        });
        await batch.commit();
        alert("백업 파일의 기록이 성공적으로 구글 클라우드에 불러와졌습니다!");
      } catch (e) {
        alert("데이터 복구 중 오류 발생: " + e.message);
      }
    };

    window.getLogsList = function() { return logs; };
  </script>
